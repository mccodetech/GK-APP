<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Academy - Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .small-btn { width: auto !important; padding: 6px 15px !important; font-size: 13px !important; background-color: #d32f2f !important; margin-top: 15px; }
        .back-btn { width: auto !important; padding: 6px 15px !important; font-size: 13px !important; background-color: #757575 !important; margin-top: 15px; margin-right: 5px; }
        .menu-btn { width: 100%; padding: 14px; background-color: #00796b; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; text-align: left; margin-bottom: 10px; font-weight: bold; transition: 0.2s; }
        .menu-btn:hover { background-color: #004d40; }
        .menu-btn.locked { background-color: #b0bec5 !important; cursor: not-allowed; }
        .user-profile { background: #e0f2f1; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #b2dfdb; }
        
        .timer-container { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .circular-timer { position: relative; width: 50px; height: 50px; border-radius: 50%; background: conic-gradient(#00796b 360deg, #e0e0e0 0deg); display: flex; justify-content: center; align-items: center; }
        .circular-timer span { position: absolute; font-size: 14px; font-weight: bold; color: #333; background: white; width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        .q-progress-bar { display: flex; gap: 4px; justify-content: center; margin-bottom: 15px; }
        .q-dot { width: 22px; height: 6px; background: #e0e0e0; border-radius: 3px; }
        .q-dot.correct { background: #4caf50; }
        .q-dot.wrong { background: #f44336; }

        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; text-align: left; }
        .leaderboard-table th, .leaderboard-table td { border: 1px solid #ddd; padding: 8px; }
        .leaderboard-table th { background-color: #00796b; color: white; }
        
        .result-box-container { text-align: center; padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 8px; margin-top: 15px; }
        @media (max-width: 480px) {
            body { padding: 8px; }
            .container { padding: 12px; }
            .menu-btn { font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <h2 style="color: #00796b; margin-top: 0; text-align: center; font-size: 22px;">Smart Academy</h2>

        <!-- കുട്ടിയുടെ പ്രൊഫൈൽ & സ്കോർ -->
        <div class="user-profile">
            <div>
                <span id="user-icon" style="font-size: 20px;">⭐</span>
                <span id="welcome-user" style="font-weight: bold; color: #00796b; font-size: 15px;"></span>
            </div>
            <div>
                <button onclick="openEditProfile()" style="padding: 4px 8px; background: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; margin-right: 4px;">പേര് മാറ്റുക</button>
                <span id="user-score-display" style="font-weight: bold; color: #333; font-size: 14px;">സ്കോർ: 0</span>
            </div>
        </div>

        <!-- പ്രൊഫൈൽ എഡിറ്റ് ബോക്സ് -->
        <div id="edit-profile-box" style="display: none; background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; text-align: left;">
            <h4 style="margin-top: 0; color: #00796b; font-size: 14px;">പ്രൊഫൈൽ വിവരങ്ങൾ മാറ്റുക</h4>
            <label style="font-size: 12px; font-weight: bold;">പുതിയ പേര്:</label>
            <input type="text" id="new-name-input" style="width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;">
            <button onclick="updateUserName()" style="background: #4caf50; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">സേവ് ചെയ്യുക</button>
            <button onclick="closeEditProfile()" style="background: #757575; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">റദ്ദാക്കുക</button>
        </div>

        <!-- 1. പ്രധാന കാറ്റഗറി മെനു -->
        <div id="main-category-section">
            <h3 style="font-size: 16px; color: #333;">വിഭാഗങ്ങൾ തിരഞ്ഞെടുക്കുക</h3>
            <button class="menu-btn" onclick="selectCategory('madrasa')">📖 മദ്രസ പഠനങ്ങൾ</button>
            <button class="menu-btn" onclick="selectCategory('school')">🏫 സ്കൂൾ പഠനങ്ങൾ</button>
            <button class="menu-btn" onclick="selectCategory('gk')">🌍 GK & കറന്റ് അഫയേഴ്സ്</button>
            <button class="menu-btn" onclick="showLeaderboard()" style="background-color: #f57c00;">🏆 Leaderboard (സ്കോർ ബോർഡ്)</button>
        </div>

        <!-- ലീഡർബോർഡ് സെക്ഷൻ -->
        <div id="leaderboard-section" style="display: none; text-align: left;">
            <h3 style="color: #f57c00; font-size: 16px;">🏆 ടോപ് സ്കോറർമാർ (Leaderboard)</h3>
            <div style="max-height: 220px; overflow-y: auto;">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>റാങ്ക്</th>
                            <th>പേര്</th>
                            <th>സ്കോർ</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="3" style="text-align: center;">ലോഡ് ചെയ്യുന്നു...</td></tr>
                    </tbody>
                </table>
            </div>
            <button onclick="goBackToMain()" class="back-btn">പിന്നോട്ട് (Back)</button>
        </div>

        <!-- 2. സബ് സെക്ഷൻ -->
        <div id="sub-category-section" style="display: none;">
            <h3 id="sub-title" style="font-size: 15px; color: #333;"></h3>
            <div id="sub-items-container" style="max-height: 230px; overflow-y: auto;"></div>
            <br>
            <button onclick="goBackToMain()" class="back-btn">പിന്നോട്ട് (Back)</button>
        </div>

        <!-- 3. പഠനം തുടങ്ങാനുള്ള നിർദ്ദേശം -->
        <div id="intro-box" style="display: none; text-align: center;">
            <h3 id="intro-title" style="font-size: 16px; color: #00796b;">ക്വിസ്</h3>
            <p id="intro-desc" style="font-size: 14px; color: #555;">ഈ പാഠത്തിലെ ചോദ്യങ്ങൾക്കും 100% ശരിയായ ഉത്തരം നൽകിയാൽ മാത്രമേ അടുത്ത ഘട്ടം അൺലോക്ക് ആകൂ!</p>
            <button onclick="startActualQuiz()" style="background-color: #0288d1; width: 100%; padding: 12px; font-size: 15px; border:none; color:white; border-radius:6px; cursor:pointer; font-weight: bold;">പഠനം തുടങ്ങുക (Start Quiz)</button>
            <br>
            <button onclick="goBackToMain()" class="back-btn">പിന്നോട്ട് (Back)</button>
        </div>

        <!-- 4. ക്വിസ് സെക്ഷൻ -->
        <div id="quiz-box" style="display: none; text-align: left;">
            <div class="q-progress-bar" id="q-dots-container"></div>

            <div class="timer-container">
                <div class="circular-timer" id="timer-circle">
                    <span id="timer-text">20</span>
                </div>
            </div>

            <h3 id="question-title" style="font-size: 15px; color: #333;">ചോദ്യം ഇവിടെ വരുന്നു...</h3>
            <div id="options-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
            
            <button onclick="goBackToMain()" class="back-btn" style="margin-top: 15px;">പിന്നോട്ട് (Back)</button>
        </div>

        <!-- 5. റിസൾട്ട് കാണിക്കാനുള്ള സെക്ഷൻ -->
        <div id="result-box" class="result-box-container" style="display: none;"></div>

        <div style="text-align: center;">
            <button onclick="logout()" class="small-btn">പുറത്തുപോവുക (Logout)</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const userPhone = localStorage.getItem('userPhone');
        const userIcon = localStorage.getItem('userIcon') || '⭐';

        let userScore = 0;
        let activeQuestions = [];
        let lessonPhases = [];
        let currentPhaseIndex = 0;
        let rawLessonQuestions = [];
        let userDocId = "";
        let userDataObj = {};
        let currentSelectedSubject = "";
        let currentActiveLesson = 1;
        let currentLessonTitle = "";

        if (!userPhone) window.location.href = "index.html";
        else {
            document.getElementById('user-icon').innerText = userIcon;
            fetchUserData();
        }

        function fetchUserData() {
            db.collection('users').where('phone', '==', userPhone).get().then(snapshot => {
                if(snapshot.empty) {
                    localStorage.clear();
                    window.location.href = "index.html";
                    return;
                }
                snapshot.forEach(doc => {
                    userDocId = doc.id;
                    userDataObj = doc.data();
                    
                    // അഡ്മിൻ പെൻഡിങ് ഒഴിവാക്കി നേരിട്ട് ആപ്പിലേക്ക് കയറാൻ (Approved ആയാൽ മാത്രം ഡാഷ്‌ബോർഡ്)
                    if(userDataObj.status !== 'approved') {
                        db.collection('users').doc(docDocId).update({ status: 'approved' });
                    }

                    userScore = userDataObj.score || 0;
                    document.getElementById('welcome-user').innerText = userDataObj.name;
                    document.getElementById('user-score-display').innerText = `സ്കോർ: ${userScore}`;
                    localStorage.setItem('userName', userDataObj.name);
                });
            });
        }

        function openEditProfile() {
            let currentName = document.getElementById('welcome-user').innerText;
            document.getElementById('new-name-input').value = currentName;
            document.getElementById('edit-profile-box').style.display = 'block';
        }

        function closeEditProfile() {
            document.getElementById('edit-profile-box').style.display = 'none';
        }

        function updateUserName() {
            let newName = document.getElementById('new-name-input').value.trim();
            if(!newName) { alert("ദയവായി പേര് നൽകുക!"); return; }

            if(userDocId) {
                db.collection('users').doc(userDocId).update({ name: newName }).then(() => {
                    alert("പേര് വിജയകരമായി മാറ്റി!");
                    document.getElementById('welcome-user').innerText = newName;
                    localStorage.setItem('userName', newName);
                    closeEditProfile();
                }).catch(err => { alert("എറർ: " + err); });
            }
        }

        function selectCategory(category) {
            hideAllSections();
            const subSection = document.getElementById('sub-category-section');
            const subTitle = document.getElementById('sub-title');
            const container = document.getElementById('sub-items-container');
            container.innerHTML = '';
            subSection.style.display = 'block';

            if (category === 'madrasa' || category === 'school') {
                let catName = category === 'madrasa' ? 'മദ്രസ' : 'സ്കൂൾ';
                subTitle.innerText = `${catName} ക്ലാസുകൾ തിരഞ്ഞെടുക്കുക`;
                for (let i = 1; i <= 10; i++) {
                    let btn = document.createElement('button');
                    btn.className = 'menu-btn';
                    btn.innerText = `ക്ലാസ്സ് ${i} (${catName})`;
                    btn.onclick = () => showSubjects(category, i);
                    container.appendChild(btn);
                }
            } else if (category === 'gk') {
                subTitle.innerText = "വിഷയങ്ങൾ തിരഞ്ഞെടുക്കുക";
                db.collection('settings').doc('gk_subjects').get().then(doc => {
                    container.innerHTML = '';
                    if(doc.exists && doc.data().subjects) {
                        doc.data().subjects.forEach(subj => {
                            let btn = document.createElement('button');
                            btn.className = 'menu-btn';
                            btn.innerText = subj;
                            btn.onclick = () => showLessonsForSubject(subj);
                            container.appendChild(btn);
                        });
                    } else {
                        container.innerHTML = '<p style="color:red;">വിഷയങ്ങൾ ലഭ്യമല്ല.</p>';
                    }
                });
            }
        }

        function showSubjects(category, classNum) {
            const subTitle = document.getElementById('sub-title');
            const container = document.getElementById('sub-items-container');
            let catName = category === 'madrasa' ? 'മദ്രസ' : 'സ്കൂൾ';
            
            subTitle.innerText = `${catName} - ക്ലാസ്സ് ${classNum} - വിഷയം തിരഞ്ഞെടുക്കുക`;
            container.innerHTML = '<p style="color:#00796b;">ലോഡ് ചെയ്യുന്നു...</p>';

            let docKey = category + '_class_' + classNum;

            db.collection('settings').doc(docKey).get().then(doc => {
                container.innerHTML = '';
                if (doc.exists && doc.data().subjects && doc.data().subjects.length > 0) {
                    doc.data().subjects.forEach(subj => {
                        let btn = document.createElement('button');
                        btn.className = 'menu-btn';
                        btn.innerText = subj;
                        btn.onclick = () => showLessonsForSubject(subj);
                        container.appendChild(btn);
                    });
                } else {
                    container.innerHTML = '<p style="color:red; font-weight:bold;">ഈ ക്ലാസിലേക്ക് അഡ്മിൻ ഇതുവരെ വിഷയങ്ങൾ നൽകിയിട്ടില്ല!</p>';
                }
            }).catch(error => {
                container.innerHTML = '<p style="color:red;">എറർ സംഭവിച്ചു.</p>';
            });
        }

        function showLessonsForSubject(subjectName) {
            currentSelectedSubject = subjectName;
            hideAllSections();
            let subSection = document.getElementById('sub-category-section');
            subSection.style.display = 'block';

            const subTitle = document.getElementById('sub-title');
            const container = document.getElementById('sub-items-container');

            subTitle.innerText = `${subjectName} - പാഠങ്ങൾ തിരഞ്ഞെടുക്കുക`;
            container.innerHTML = '<p style="color:#00796b;">പാഠങ്ങൾ പരിശോധിക്കുന്നു...</p>';

            db.collection('questions').where('subject', '==', subjectName).get().then(snapshot => {
                container.innerHTML = '';
                let lessonsSet = new Set();
                snapshot.forEach(doc => {
                    let d = doc.data();
                    lessonsSet.add(d.lesson || 1);
                });

                let maxLesson = lessonsSet.size > 0 ? Math.max(...lessonsSet) : 1;
                let totalLessons = maxLesson < 5 ? 5 : maxLesson;
                let completedLessons = (userDataObj.progress && userDataObj.progress[subjectName]) || 0;

                for (let l = 1; l <= totalLessons; l++) {
                    let btn = document.createElement('button');
                    btn.className = 'menu-btn';
                    let isUnlocked = (l === 1 || l <= completedLessons + 1);

                    if (isUnlocked) {
                        btn.innerText = `📖 പാഠം (Lesson) ${l} ${l <= completedLessons ? '✅ (വിജയിച്ചു)' : ''}`;
                        btn.onclick = () => loadQuestionsForLesson(subjectName, l);
                    } else {
                        btn.className += ' locked';
                        btn.innerText = `🔒 പാഠം (Lesson) ${l} (ലോക്ക് ചെയ്തിരിക്കുന്നു)`;
                        btn.onclick = () => alert("മുൻപത്തെ പാഠം പൂർത്തിയാക്കിയാൽ മാത്രമേ ഇത് അൺലോക്ക് ആവുകയുള്ളൂ!");
                    }
                    container.appendChild(btn);
                }
            });
        }

        function loadQuestionsForLesson(subjectName, lessonNo) {
            currentActiveLesson = lessonNo;
            currentLessonTitle = `${subjectName} - പാഠം ${lessonNo}`;
            const subTitle = document.getElementById('sub-title');
            const container = document.getElementById('sub-items-container');
            subTitle.innerText = `${currentLessonTitle} - ചോദ്യങ്ങൾ ലോഡ് ചെയ്യുന്നു...`;
            container.innerHTML = '<p style="color:#00796b;">ദയവായി കാത്തിരിക്കുക...</p>';

            db.collection('questions').where('subject', '==', subjectName).where('lesson', '==', lessonNo).get().then(snapshot => {
                rawLessonQuestions = [];
                snapshot.forEach(doc => {
                    let row = doc.data();
                    rawLessonQuestions.push({
                        q: row.Question,
                        options: [row.Option_A, row.Option_B, row.Option_C, row.Option_D],
                        answerText: row.answerText
                    });
                });

                if(rawLessonQuestions.length > 0) {
                    let shuffled = shuffleArray([...rawLessonQuestions]);
                    lessonPhases = [];
                    for (let i = 0; i < shuffled.length; i += 10) {
                        lessonPhases.push(shuffled.slice(i, i + 10));
                    }
                    currentPhaseIndex = 0;
                    prepareQuiz();
                } else {
                    alert("ഈ പാഠത്തിൽ ചോദ്യങ്ങൾ ലഭ്യമല്ല!");
                    showLessonsForSubject(subjectName);
                }
            }).catch(err => {
                alert("ചോദ്യങ്ങൾ ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്!");
            });
        }

        function prepareQuiz() {
            hideAllSections();
            document.getElementById('intro-box').style.display = 'block';
            document.getElementById('intro-title').innerText = `${currentLessonTitle} (ഫേസ് ${currentPhaseIndex + 1}/${lessonPhases.length})`;
            document.getElementById('intro-desc').innerText = `ഈ പാഠത്തിലെ ഫേസ് ${currentPhaseIndex + 1}-ലെ ചോദ്യങ്ങൾക്കും 100% ശരിയായ ഉത്തരം നൽകുക!`;
            
            activeQuestions = lessonPhases[currentPhaseIndex];
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        let timerInterval;
        let questionStatuses = [];

        function setupDots(maxQ) {
            const dotsContainer = document.getElementById('q-dots-container');
            if(!dotsContainer) return;
            dotsContainer.innerHTML = '';
            for(let i=0; i<maxQ; i++) {
                let dot = document.createElement('div');
                dot.className = `q-dot ${questionStatuses[i] || ''}`;
                dotsContainer.appendChild(dot);
            }
        }

        function startActualQuiz() {
            hideAllSections();
            document.getElementById('quiz-box').style.display = 'block';

            let currentQIndex = 0;
            let correctAnswersCount = 0;
            let maxQuestions = activeQuestions.length; 
            questionStatuses = Array(maxQuestions).fill('');

            function showQuestion() {
                if (currentQIndex < maxQuestions) {
                    setupDots(maxQuestions);
                    let qData = activeQuestions[currentQIndex];
                    document.getElementById('question-title').innerText = `ചോദ്യം ${currentQIndex + 1}/${maxQuestions}: ${qData.q}`;
                    let optContainer = document.getElementById('options-container');
                    optContainer.innerHTML = '';

                    let shuffledOptions = shuffleArray([...qData.options]);
                    let timeLeft = 20;
                    document.getElementById('timer-text').innerText = timeLeft;
                    updateTimerCircle(timeLeft, 20);

                    clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        document.getElementById('timer-text').innerText = timeLeft;
                        updateTimerCircle(timeLeft, 20);

                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            questionStatuses[currentQIndex] = 'wrong';
                            currentQIndex++;
                            showQuestion();
                        }
                    }, 1000);

                    shuffledOptions.forEach((opt) => {
                        let optBtn = document.createElement('button');
                        optBtn.innerText = opt;
                        optBtn.className = 'menu-btn';
                        optBtn.style.marginBottom = "6px";
                        optBtn.onclick = () => {
                            clearInterval(timerInterval);
                            
                            let selectedOpt = String(opt).trim().toLowerCase();
                            let correctAns = String(qData.answerText).trim().toLowerCase();

                            if (selectedOpt === correctAns) {
                                correctAnswersCount++;
                                questionStatuses[currentQIndex] = 'correct';
                            } else {
                                questionStatuses[currentQIndex] = 'wrong';
                            }
                            currentQIndex++;
                            showQuestion();
                        };
                        optContainer.appendChild(optBtn);
                    });
                } else {
                    clearInterval(timerInterval);
                    setupDots(maxQuestions);
                    evaluateResult(correctAnswersCount, maxQuestions);
                }
            }
            showQuestion();
        }

        function updateTimerCircle(current, total) {
            let degree = (current / total) * 360;
            document.getElementById('timer-circle').style.background = `conic-gradient(#00796b ${degree}deg, #e0e0e0 0deg)`;
        }

        function evaluateResult(scoreCount, total) {
            let percentage = (scoreCount / total) * 100;
            
            document.getElementById('quiz-box').style.display = 'none';
            const resultBox = document.getElementById('result-box');
            resultBox.style.display = 'block';

            if (scoreCount === total) {
                if (currentPhaseIndex + 1 < lessonPhases.length) {
                    resultBox.innerHTML = `<h3 style="color: #388e3c; font-size: 16px;">🎉 അഭിനന്ദനങ്ങൾ! ഫേസ് ${currentPhaseIndex + 1} വിജയിച്ചു!</h3>
                                        <p style="font-size: 15px; font-weight: bold;">സ്കോർ: ${scoreCount}/${total} (100%)</p>
                                        <button onclick="nextPhase()" style="background:#00796b; width:100%; padding:12px; font-size:15px; color:white; border:none; border-radius:6px; cursor:pointer; font-weight: bold;">അടുത്ത ഫേസിലേക്ക് പോവുക (Next Phase)</button>`;
                } else {
                    resultBox.innerHTML = `<h3 style="color: #388e3c; font-size: 16px;">🎉 അഭിനന്ദനങ്ങൾ! നിങ്ങൾ ഈ പാഠം പൂർണ്ണമായി വിജയിച്ചു!</h3>
                                        <p style="font-size: 16px; font-weight: bold;">സ്കോർ: ${scoreCount}/${total} (100%)</p>
                                        <button onclick="showLessonsForSubject('${currentSelectedSubject}')" style="background:#00796b; width:100%; padding:12px; font-size:15px; color:white; border:none; border-radius:6px; cursor:pointer; font-weight: bold;">തുടരുക (Next Lessons)</button>`;
                    
                    updateProgressAndScore(currentSelectedSubject, currentActiveLesson, scoreCount * 5);
                }
            } else {
                resultBox.innerHTML = `<h3 style="color: #d32f2f; font-size: 16px;">❌ പരാജയപ്പെട്ടു!</h3>
                                    <p style="font-size: 14px;">നിങ്ങൾക്ക് ${scoreCount}/${total} (${percentage}%) മാത്രമേ ലഭിച്ചുള്ളൂ.<br>ഈ ഫേസ് പാസ്സ് ആകാൻ 100% ശരിയായിരിക്കണം.</p>
                                    <button onclick="restartQuiz()" style="background:#d32f2f; width:100%; padding:12px; font-size:15px; color:white; border:none; border-radius:6px; cursor:pointer; margin-bottom: 10px; font-weight: bold;">വീണ്ടും ശ്രമിക്കുക (Try Again)</button>
                                    <button onclick="showLessonsForSubject('${currentSelectedSubject}')" style="background:#757575; width:100%; padding:12px; font-size:15px; color:white; border:none; border-radius:6px; cursor:pointer; font-weight: bold;">പാഠങ്ങളുടെ ലിസ്റ്റിലേക്ക് പോവുക</button>`;
            }
        }

        function nextPhase() {
            currentPhaseIndex++;
            prepareQuiz();
        }

        function restartQuiz() {
            startActualQuiz();
        }

        async function updateProgressAndScore(subject, lessonNum, addedScore) {
            if(userDocId) {
                let currentProgress = userDataObj.progress || {};
                let highestLessonDone = currentProgress[subject] || 0;

                let isNewHigher = lessonNum > highestLessonDone;
                if(isNewHigher) {
                    currentProgress[subject] = lessonNum;
                }

                let newTotalScore = userScore;
                if(isNewHigher) {
                    newTotalScore = userScore + addedScore;
                    userDataObj.score = newTotalScore;
                }
                
                userDataObj.progress = currentProgress;

                db.collection('users').doc(userDocId).update({
                    score: newTotalScore,
                    progress: currentProgress
                }).then(() => {
                    fetchUserData();
                });
            }
        }

        function showLeaderboard() {
            hideAllSections();
            document.getElementById('leaderboard-section').style.display = 'block';
            let tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">ലോഡ് ചെയ്യുന്നു...</td></tr>';

            db.collection('users').where('status', '==', 'approved').get().then(snapshot => {
                tbody.innerHTML = '';
                let usersList = [];
                snapshot.forEach(doc => {
                    usersList.push(doc.data());
                });

                usersList.sort((a, b) => (b.score || 0) - (a.score || 0));

                let rank = 1;
                if(usersList.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">വിവരങ്ങൾ ലഭ്യമല്ല.</td></tr>';
                    return;
                }

                usersList.slice(0, 10).forEach(d => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `<td><b>#${rank}</b></td><td>${d.name}</td><td><b>${d.score || 0}</b></td>`;
                    tbody.appendChild(tr);
                    rank++;
                });
            }).catch(err => {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color:red;">ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്.</td></tr>';
            });
        }

        function hideAllSections() {
            document.getElementById('main-category-section').style.display = 'none';
            document.getElementById('sub-category-section').style.display = 'none';
            document.getElementById('intro-box').style.display = 'none';
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('leaderboard-section').style.display = 'none';
            document.getElementById('edit-profile-box').style.display = 'none';
            clearInterval(timerInterval);
        }

        function goBackToMain() {
            hideAllSections();
            document.getElementById('main-category-section').style.display = 'block';
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
