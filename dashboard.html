<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>പഠന ഡാഷ്‌ബോർഡ് - ക്വിസ്</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .small-btn { width: auto !important; padding: 6px 15px !important; font-size: 14px !important; background-color: #d32f2f !important; margin-top: 15px; }
        .level-btn { width: 100%; padding: 12px; background-color: #00796b; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; text-align: left; margin-bottom: 8px; }
        .level-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .user-profile { background: #e0f2f1; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .timer-container { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .circular-timer { position: relative; width: 50px; height: 50px; border-radius: 50%; background: conic-gradient(#00796b 360deg, #e0e0e0 0deg); display: flex; justify-content: center; align-items: center; }
        .circular-timer span { position: absolute; font-size: 14px; font-weight: bold; color: #333; background: white; width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        .q-progress-bar { display: flex; gap: 4px; justify-content: center; margin-bottom: 15px; }
        .q-dot { width: 25px; height: 8px; background: #e0e0e0; border-radius: 4px; }
        .q-dot.active { background: #ff9800; }
        .q-dot.correct { background: #4caf50; }
        .q-dot.wrong { background: #f44336; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 650px;">
        
        <!-- കുട്ടിയുടെ പ്രൊഫൈൽ & സ്കോർ -->
        <div class="user-profile">
            <div>
                <span id="user-icon" style="font-size: 22px;">⭐</span>
                <span id="welcome-user" style="font-weight: bold; color: #00796b; font-size: 16px;"></span>
            </div>
            <div id="user-score-display" style="font-weight: bold; color: #333;">സ്കോർ: 0</div>
        </div>

        <!-- ലെവൽ സെലക്ഷൻ സെക്ഷൻ -->
        <div id="level-section">
            <h3>ഘട്ടങ്ങൾ തിരഞ്ഞെടുക്കുക</h3>
            <div id="levels-container" style="max-height: 250px; overflow-y: auto;"></div>
        </div>

        <!-- പഠനം തുടങ്ങാനുള്ള നിർദ്ദേശം -->
        <div id="intro-box" style="display: none; text-align: center;">
            <h3 id="intro-title">ഘട്ടം</h3>
            <p>ഈ ഘട്ടത്തിലെ 10 ചോദ്യങ്ങൾക്കും 100% ശരിയായ ഉത്തരം നൽകിയാൽ മാത്രമേ വിജയിക്കൂ!</p>
            <button onclick="startActualQuiz()" style="background-color: #0288d1; padding: 12px; font-size: 16px;">പഠനം തുടങ്ങുക (Start Quiz)</button>
            <br>
            <button onclick="location.reload()" class="small-btn" style="background-color: #757575 !important;">തിരികെ പോവുക</button>
        </div>

        <!-- ക്വിസ് സെക്ഷൻ -->
        <div id="quiz-box" style="display: none; text-align: left;">
            <div class="q-progress-bar" id="q-dots-container"></div>

            <div class="timer-container">
                <div class="circular-timer" id="timer-circle">
                    <span id="timer-text">20</span>
                </div>
            </div>

            <h3 id="question-title">ചോദ്യം ഇവിടെ വരുന്നു...</h3>
            <div id="options-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <button onclick="logout()" class="small-btn">പുറത്തുപോവുക (Logout)</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const userName = localStorage.getItem('userName');
        const userPhone = localStorage.getItem('userPhone');
        const userIcon = localStorage.getItem('userIcon') || '⭐';

        let userCurrentLevel = 1;
        let userScore = 0;
        let selectedLevel = 1;

        const levelNames = [
            "ഘട്ടം 1: അടിസ്ഥാന പാഠങ്ങൾ (Basics)",
            "ഘട്ടം 2: പ്രാരംഭ ജ്ഞാനം (Beginner GK)",
            "ഘട്ടം 3: മദ്രസ വിജ്ഞാനീയം (Madrasa Basics)",
            "ഘട്ടം 4: ചരിത്ര വഴികളിലൂടെ (History)",
            "ഘട്ടം 5: ഇസ്ലാമിക ചരിത്രം (Islamic History)",
            "ഘട്ടം 6: ശാസ്ത്രവും പ്രകൃതിയും (Science)",
            "ഘട്ടം 7: ഖുർആൻ പഠനങ്ങൾ (Quranic Studies)",
            "ഘട്ടം 8: ഹദീസ് വിശേഷങ്ങൾ (Hadith)",
            "ഘട്ടം 9: ഉന്നത നിലവാരം (Advanced GK)",
            "ഘട്ടം 10: ഗ്രാൻഡ് ഫിനാലെ (Grand Finale)"
        ];

        if (!userPhone) {
            window.location.href = "index.html";
        } else {
            document.getElementById('user-icon').innerText = userIcon;
            fetchUserData();
        }

        function fetchUserData() {
            db.collection('users').where('phone', '==', userPhone).get().then(snapshot => {
                snapshot.forEach(doc => {
                    let data = doc.data();
                    userNameFromDb = data.name;
                    userScore = data.score || 0;
                    userCurrentLevel = data.currentLevel || 1;

                    document.getElementById('welcome-user').innerText = `${userNameFromDb} (ഘട്ടം ${userCurrentLevel})`;
                    document.getElementById('user-score-display').innerText = `സ്കോർ: ${userScore}`;
                    loadLevels();
                });
            });
        }

        function loadLevels() {
            const container = document.getElementById('levels-container');
            container.innerHTML = '';
            levelNames.forEach((name, index) => {
                let levelNum = index + 1;
                let btn = document.createElement('button');
                btn.innerText = name;
                btn.className = 'level-btn';
                
                if (levelNum > userCurrentLevel) {
                    btn.disabled = true;
                    btn.innerText += " 🔒";
                } else {
                    btn.onclick = () => showIntro(levelNum);
                }
                container.appendChild(btn);
            });
        }

        function showIntro(levelNum) {
            selectedLevel = levelNum;
            document.getElementById('level-section').style.display = 'none';
            document.getElementById('intro-box').style.display = 'block';
            document.getElementById('intro-title').innerText = levelNames[levelNum - 1];
        }

        const sampleQuestions = [
            { q: "ഇസ്‌ലാമിന്റെ അടിസ്ഥാനസ്തംഭങ്ങൾ എത്ര?", options: ["3", "4", "5", "6"], answerText: "5" },
            { q: "ഖുർആനിലെ ആകെ അധ്യായങ്ങൾ എത്ര?", options: ["114", "110", "120", "100"], answerText: "114" },
            { q: "ആദ്യത്തെ നബി ആര്?", options: ["ഇബ്രാഹിം നബി (അ)", "ആദം നബി (അ)", "മൂസാ നബി (അ)", "മുഹമ്മദ് നബി (സ)"], answerText: "ആദം നബി (അ)" },
            { q: "വിശുദ്ധ ഖുർആൻ അവതരിച്ച മാസം?", options: ["റമദാൻ", "മുഹറം", "റബിഉൽ അവ്വൽ", "ശവ്വാൽ"], answerText: "റമദാൻ" },
            { q: "ഇസ്ലാമിക കലണ്ടറിലെ ആദ്യ മാസം?", options: ["സഫർ", "റമദാൻ", "മുഹറം", "റെജബ്"], answerText: "മുഹറം" },
            { q: "നമ്മുടെ രാജ്യമായ ഇന്ത്യയുടെ തലസ്ഥാനം?", options: ["മുംബൈ", "കൊൽക്കത്ത", "ഡെൽഹി", "ചെന്നൈ"], answerText: "ഡെൽഹി" },
            { q: "കേരളത്തിന്റെ തലസ്ഥാനം ഏത്?", options: ["കോഴിക്കോട്", "തിരുവനന്തപുരം", "കൊച്ചി", "തൃശ്ശൂർ"], answerText: "തിരുവനന്തപുരം" },
            { q: "ലോകത്തിലെ ഏറ്റവും വലിയ മഹാസമുദ്രം?", options: ["അറ്റ്‌ലാന്റിക്", "ഇന്ത്യൻ മഹാസമുദ്രം", "ആർട്ടിക്", "ശാന്ത സമുദ്രം (Pacific)"], answerText: "ശാന്ത സമുദ്രം (Pacific)" },
            { q: "സൂര്യൻ ഉദിക്കുന്നത് ഏത് ദിക്കിലാണ്?", options: ["പടിഞ്ഞാറ്", "കിഴക്ക്", "വടക്ക്", "തെക്ക്"], answerText: "കിഴക്ക്" },
            { q: "കമ്പ്യൂട്ടറിന്റെ പിതാവ് ആര്?", options: ["ചാൾസ് ബാബേജ്", "ആൽബർട്ട് ഐൻസ്റ്റീൻ", "തോമസ് ആൽവ എഡിസൺ", "ഐസക് ന്യൂട്ടൺ"], answerText: "ചാൾസ് ബാബേജ്" }
        ];

        let timerInterval;
        let questionStatuses = Array(10).fill('');

        function setupDots() {
            const dotsContainer = document.getElementById('q-dots-container');
            dotsContainer.innerHTML = '';
            for(let i=0; i<10; i++) {
                let dot = document.createElement('div');
                dot.className = `q-dot ${questionStatuses[i]}`;
                dotsContainer.appendChild(dot);
            }
        }

        // ഓപ്ഷനുകൾ ഷഫിൾ ചെയ്യാൻ (Randomize Options)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function startActualQuiz() {
            document.getElementById('intro-box').style.display = 'none';
            const quizBox = document.getElementById('quiz-box');
            quizBox.style.display = 'block';

            let currentQIndex = 0;
            let correctAnswersCount = 0;
            const totalQuestions = sampleQuestions.length;
            questionStatuses = Array(10).fill('');

            function showQuestion() {
                if (currentQIndex < totalQuestions) {
                    setupDots();
                    let qData = sampleQuestions[currentQIndex];
                    document.getElementById('question-title').innerText = `ചോദ്യം ${currentQIndex + 1}/10: ${qData.q}`;
                    
                    let optContainer = document.getElementById('options-container');
                    optContainer.innerHTML = '';

                    // ഓപ്ഷനുകൾ ഷഫിൾ ചെയ്യുന്നു
                    let shuffledOptions = shuffleArray([...qData.options]);

                    let timeLeft = 20;
                    document.getElementById('timer-text').innerText = timeLeft;
                    updateTimerCircle(timeLeft, 20);

                    clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        document.getElementById('timer-text').innerText = timeLeft;
                        updateTimerCircle(timeLeft, 20);

                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            questionStatuses[currentQIndex] = 'wrong';
                            currentQIndex++;
                            showQuestion();
                        }
                    }, 1000);

                    shuffledOptions.forEach((opt) => {
                        let optBtn = document.createElement('button');
                        optBtn.innerText = opt;
                        optBtn.style.backgroundColor = "#00897b";
                        optBtn.onclick = () => {
                            clearInterval(timerInterval);
                            if (opt === qData.answerText) {
                                correctAnswersCount++;
                                questionStatuses[currentQIndex] = 'correct';
                            } else {
                                questionStatuses[currentQIndex] = 'wrong';
                            }
                            currentQIndex++;
                            showQuestion();
                        };
                        optContainer.appendChild(optBtn);
                    });
                } else {
                    clearInterval(timerInterval);
                    setupDots();
                    evaluateResult(selectedLevel, correctAnswersCount, totalQuestions);
                }
            }
            showQuestion();
        }

        function updateTimerCircle(current, total) {
            let degree = (current / total) * 360;
            let circle = document.getElementById('timer-circle');
            circle.style.background = `conic-gradient(#00796b ${degree}deg, #e0e0e0 0deg)`;
        }

        function evaluateResult(levelNum, scoreCount, total) {
            let percentage = (scoreCount / total) * 100;
            const quizBox = document.getElementById('quiz-box');

            // 100% മാർക്ക് (10/10) നേടിയാൽ മാത്രമേ അടുത്ത ലെവലിലേക്ക് പോകാൻ പാടൂ
            if (scoreCount === total) {
                let nextLevel = (levelNum >= userCurrentLevel) ? levelNum + 1 : userCurrentLevel;
                quizBox.innerHTML = `<h3>🎉 അഭിനന്ദനങ്ങൾ! നിങ്ങൾ വിജയിച്ചു!</h3>
                                    <p>സ്കോർ: ${scoreCount}/${total} (100%)</p>
                                    <button onclick="location.reload()" style="background:#00796b;">മറ്റ് ഘട്ടങ്ങളിലേക്ക് പോവുക</button>`;
                updateScoreAndLevel(scoreCount * 5, nextLevel);
            } else {
                quizBox.innerHTML = `<h3>❌ പരാജയപ്പെട്ടു!</h3>
                                    <p>നിങ്ങൾക്ക് ${scoreCount}/${total} (${percentage}%) മാത്രമേ ലഭിച്ചുള്ളൂ. അടുത്ത ഘട്ടത്തിലേക്ക് പോകാൻ 100% (എല്ലാ ചോദ്യങ്ങളും) ശരിയായിരിക്കണം.</p>
                                    <button onclick="location.reload()" style="background:#d32f2f;">വീണ്ടും ശ്രമിക്കുക (Try Again)</button>`;
            }
        }

        async function updateScoreAndLevel(addedScore, newLevel) {
            const snapshot = await db.collection('users').where('phone', '==', userPhone).get();
            snapshot.forEach(doc => {
                let currentTotal = doc.data().score || 0;
                let currentMaxLevel = doc.data().currentLevel || 1;
                
                db.collection('users').doc(doc.id).update({
                    score: currentTotal + addedScore,
                    currentLevel: newLevel > currentMaxLevel ? newLevel : currentMaxLevel
                });
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
