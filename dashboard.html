<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>പഠന ഡാഷ്‌ബോർഡ് - ക്വിസ്</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .timer-box { font-size: 18px; color: #d32f2f; font-weight: bold; margin-bottom: 10px; }
        .small-btn { width: auto !important; padding: 6px 15px !important; font-size: 14px !important; background-color: #d32f2f !important; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 650px;">
        <h2>വിഷയങ്ങൾ & പഠന ഘട്ടങ്ങൾ</h2>
        <p id="welcome-user" style="font-weight: bold; color: #00796b;"></p>

        <!-- ഗ്ലോബൽ സ്കോർ ബോർഡ് -->
        <div style="background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
            <h3 style="margin: 0 0 10px 0; font-size: 16px;">🏆 ഗ്ലോബൽ സ്കോർ ബോർഡ്</h3>
            <ul id="scoreboard-list" style="list-style: none; padding: 0; max-height: 120px; overflow-y: auto; text-align: left; margin: 0;"></ul>
        </div>

        <!-- ലെവൽ സെലക്ഷൻ സെക്ഷൻ -->
        <div id="level-section">
            <h3>ഘട്ടങ്ങൾ തിരഞ്ഞെടുക്കുക</h3>
            <div id="levels-container" style="display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto;">
                <!-- ജാവസ്ക്രിപ്റ്റ് വഴി ലെവലുകൾ ഇവിടെ വരും -->
            </div>
        </div>

        <!-- ക്വിസ് സെക്ഷൻ -->
        <div id="quiz-box" style="display: none; text-align: left;">
            <div id="timer" class="timer-box">സമയം ബാക്കി: 20 സെക്കൻഡ്</div>
            <h3 id="question-title">ചോദ്യം ഇവിടെ വരുന്നു...</h3>
            <div id="options-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <button onclick="logout()" class="small-btn">പുറത്തുപോവുക (Logout)</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const userName = localStorage.getItem('userName');
        const userPhone = localStorage.getItem('userPhone');

        if (!userPhone) {
            window.location.href = "index.html";
        } else {
            document.getElementById('welcome-user').innerText = `സ്വാഗതം, ${userName}!`;
            loadScoreboard();
            loadLevels();
        }

        const levelNames = [
            "ഘട്ടം 1: അടിസ്ഥാന പാഠങ്ങൾ (Basics)",
            "ഘട്ടം 2: പ്രാരംഭ ജ്ഞാനം (Beginner GK)",
            "ഘട്ടം 3: മദ്രസ വിജ്ഞാനീയം (Madrasa Basics)",
            "ഘട്ടം 4: ചരിത്ര വഴികളിലൂടെ (History)",
            "ഘട്ടം 5: ഇസ്ലാമിക ചരിത്രം (Islamic History)",
            "ഘട്ടം 6: ശാസ്ത്രവും പ്രകൃതിയും (Science)",
            "ഘട്ടം 7: ഖുർആൻ പഠനങ്ങൾ (Quranic Studies)",
            "ഘട്ടം 8: ഹദീസ് വിശേഷങ്ങൾ (Hadith)",
            "ഘട്ടം 9: ഉന്നത നിലവാരം (Advanced GK)",
            "ഘട്ടം 10: ഗ്രാൻഡ് ഫിനാലെ (Grand Finale)"
        ];

        function loadLevels() {
            const container = document.getElementById('levels-container');
            container.innerHTML = '';
            levelNames.forEach((name, index) => {
                let levelNum = index + 1;
                let btn = document.createElement('button');
                btn.innerText = name;
                btn.style.backgroundColor = "#00796b";
                btn.style.padding = "10px";
                btn.style.color = "white";
                btn.style.border = "none";
                btn.style.borderRadius = "5px";
                btn.style.cursor = "pointer";
                btn.onclick = () => startQuiz(levelNum);
                container.appendChild(btn);
            });
        }

        const sampleQuestions = [
            { q: "ഇസ്‌ലാമിന്റെ അടിസ്ഥാനസ്തംഭങ്ങൾ എത്ര?", options: ["3", "4", "5", "6"], answer: 2 },
            { q: "ഖുർആനിലെ ആകെ അധ്യായങ്ങൾ എത്ര?", options: ["114", "110", "120", "100"], answer: 0 },
            { q: "ആദ്യത്തെ നബി ആര്?", options: ["ഇബ്രാഹിം നബി (അ)", "ആദം നബി (അ)", "മൂസാ നബി (അ)", "മുഹമ്മദ് നബി (സ)"], answer: 1 },
            { q: "വിശുദ്ധ ഖുർആൻ അവതരിച്ച മാസം?", options: ["റമദാൻ", "മുഹറം", "റബിഉൽ അവ്വൽ", "ശവ്വാൽ"], answer: 0 },
            { q: "ഇസ്ലാമിക കലണ്ടറിലെ ആദ്യ മാസം?", options: ["സഫർ", "റമദാൻ", "മുഹറം", "റെജബ്"], answer: 2 },
            { q: "നമ്മുടെ രാജ്യമായ ഇന്ത്യയുടെ തലസ്ഥാനം?", options: ["മുംബൈ", "കൊൽക്കത്ത", "ഡെൽഹി", "ചെന്നൈ"], answer: 2 },
            { q: "കേരളത്തിന്റെ തലസ്ഥാനം ഏത്?", options: ["കോഴിക്കോട്", "തിരുവനന്തപുരം", "കൊച്ചി", "തൃശ്ശൂർ"], answer: 1 },
            { q: "ലോകത്തിലെ ഏറ്റവും വലിയ മഹാസമുദ്രം?", options: ["അറ്റ്‌ലാന്റിക്", "ഇന്ത്യൻ മഹാസമുദ്രം", "ആർട്ടിക്", "ശാന്ത സമുദ്രം (Pacific)"], answer: 3 },
            { q: "സൂര്യൻ ഉദിക്കുന്നത് ഏത് ദിക്കിലാണ്?", options: ["പടിഞ്ഞാറ്", "കിഴക്ക്", "വടക്ക്", "തെക്ക്"], answer: 1 },
            { q: "കമ്പ്യൂട്ടറിന്റെ പിതാവ് ആര്?", options: ["ചാൾസ് ബാബേജ്", "ആൽബർട്ട് ഐൻസ്റ്റീൻ", "തോമസ് ആൽവ എഡിസൺ", "ഐസക് ന്യൂട്ടൺ"], answer: 0 }
        ];

        let timerInterval;

        function startQuiz(levelNum) {
            document.getElementById('level-section').style.display = 'none';
            const quizBox = document.getElementById('quiz-box');
            quizBox.style.display = 'block';

            let currentQIndex = 0;
            let correctAnswersCount = 0;
            const totalQuestions = sampleQuestions.length;

            function showQuestion() {
                if (currentQIndex < totalQuestions) {
                    let qData = sampleQuestions[currentQIndex];
                    document.getElementById('question-title').innerText = `ചോദ്യം ${currentQIndex + 1}/10: ${qData.q}`;
                    
                    let optContainer = document.getElementById('options-container');
                    optContainer.innerHTML = '';

                    let timeLeft = 20;
                    document.getElementById('timer').innerText = `സമയം ബാക്കി: ${timeLeft} സെക്കൻഡ്`;
                    
                    clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        document.getElementById('timer').innerText = `സമയം ബാക്കി: ${timeLeft} സെക്കൻഡ്`;
                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            currentQIndex++;
                            showQuestion();
                        }
                    }, 1000);

                    qData.options.forEach((opt, idx) => {
                        let optBtn = document.createElement('button');
                        optBtn.innerText = opt;
                        optBtn.style.backgroundColor = "#00897b";
                        optBtn.onclick = () => {
                            clearInterval(timerInterval);
                            if (idx === qData.answer) {
                                correctAnswersCount++;
                            }
                            currentQIndex++;
                            showQuestion();
                        };
                        optContainer.appendChild(optBtn);
                    });
                } else {
                    clearInterval(timerInterval);
                    evaluateResult(levelNum, correctAnswersCount, totalQuestions);
                }
            }
            showQuestion();
        }

        function evaluateResult(levelNum, scoreCount, total) {
            let percentage = (scoreCount / total) * 100;
            const quizBox = document.getElementById('quiz-box');

            if (percentage >= 90) {
                quizBox.innerHTML = `<h3>🎉 അഭിനന്ദനങ്ങൾ! നിങ്ങൾ വിജയിച്ചു!</h3>
                                    <p>സ്കോർ: ${scoreCount}/${total} (${percentage}%)</p>
                                    <button onclick="location.reload()" style="background:#00796b;">മറ്റ് ഘട്ടങ്ങളിലേക്ക് പോവുക</button>`;
                updateScoreToDatabase(scoreCount * 5);
            } else {
                quizBox.innerHTML = `<h3>❌ പരാജയപ്പെട്ടു!</h3>
                                    <p>നിങ്ങൾക്ക് ${percentage}% മാത്രമേ ലഭിച്ചുള്ളൂ. മുന്നോട്ട് പോകാൻ കുറഞ്ഞത് 90% (9 ചോദ്യങ്ങൾ) ശരിയായിരിക്കണം.</p>
                                    <button onclick="location.reload()" style="background:#d32f2f;">വീണ്ടും ശ്രമിക്കുക (Try Again)</button>`;
            }
        }

        async function updateScoreToDatabase(addedScore) {
            const snapshot = await db.collection('users').where('phone', '==', userPhone).get();
            snapshot.forEach(doc => {
                let currentTotal = doc.data().score || 0;
                db.collection('users').doc(doc.id).update({
                    score: currentTotal + addedScore
                });
            });
        }

        function loadScoreboard() {
            const list = document.getElementById('scoreboard-list');
            db.collection('users').orderBy('score', 'desc').limit(5).get().then(snapshot => {
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    let data = doc.data();
                    let li = document.createElement('li');
                    li.innerText = `⭐ ${data.name} - ${data.score || 0} മാർക്ക്`;
                    li.style.padding = "4px 0";
                    li.style.borderBottom = "1px solid #ddd";
                    list.appendChild(li);
                });
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
