<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Academy - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .small-btn { width: auto !important; padding: 6px 15px !important; font-size: 14px !important; background-color: #d32f2f !important; margin-top: 15px; }
        .back-btn { width: auto !important; padding: 6px 15px !important; font-size: 14px !important; background-color: #757575 !important; margin-top: 15px; margin-right: 5px; }
        .menu-btn { width: 100%; padding: 14px; background-color: #00796b; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; text-align: left; margin-bottom: 10px; font-weight: bold; }
        .menu-btn:hover { background-color: #004d40; }
        .user-profile { background: #e0f2f1; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .timer-container { display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .circular-timer { position: relative; width: 50px; height: 50px; border-radius: 50%; background: conic-gradient(#00796b 360deg, #e0e0e0 0deg); display: flex; justify-content: center; align-items: center; }
        .circular-timer span { position: absolute; font-size: 14px; font-weight: bold; color: #333; background: white; width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        .q-progress-bar { display: flex; gap: 4px; justify-content: center; margin-bottom: 15px; }
        .q-dot { width: 25px; height: 8px; background: #e0e0e0; border-radius: 4px; }
        .q-dot.correct { background: #4caf50; }
        .q-dot.wrong { background: #f44336; }

        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; text-align: left; }
        .leaderboard-table th, .leaderboard-table td { border: 1px solid #ddd; padding: 8px; }
        .leaderboard-table th { background-color: #00796b; color: white; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 650px;">
        
        <h2 style="color: #00796b; margin-top: 0; text-align: center;">Smart Academy</h2>

        <!-- കുട്ടിയുടെ പ്രൊഫൈൽ & സ്കോർ -->
        <div class="user-profile">
            <div>
                <span id="user-icon" style="font-size: 22px;">⭐</span>
                <span id="welcome-user" style="font-weight: bold; color: #00796b; font-size: 16px;"></span>
            </div>
            <div>
                <button onclick="openEditProfile()" style="padding: 4px 8px; background: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px;">പേര് മാറ്റുക</button>
                <span id="user-score-display" style="font-weight: bold; color: #333;">സ്കോർ: 0</span>
            </div>
        </div>

        <!-- പ്രൊഫൈൽ എഡിറ്റ് ചെയ്യുന്ന ബോക്സ് -->
        <div id="edit-profile-box" style="display: none; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; text-align: left;">
            <h4 style="margin-top: 0; color: #00796b;">പ്രൊഫൈൽ വിവരങ്ങൾ മാറ്റുക</h4>
            <label style="font-size: 13px; font-weight: bold;">പുതിയ പേര്:</label>
            <input type="text" id="new-name-input" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <button onclick="updateUserName()" style="background: #4caf50; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">സേവ് ചെയ്യുക</button>
            <button onclick="closeEditProfile()" style="background: #757575; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">റദ്ദാക്കുക</button>
        </div>

        <!-- 1. പ്രധാന കാറ്റഗറി മെനു -->
        <div id="main-category-section">
            <h3>വിഭാഗങ്ങൾ തിരഞ്ഞെടുക്കുക</h3>
            <button class="menu-btn" onclick="selectCategory('madrasa')">📖 മദ്രസ പഠനങ്ങൾ</button>
            <button class="menu-btn" onclick="selectCategory('school')">🏫 സ്കൂൾ പഠനങ്ങൾ</button>
            <button class="menu-btn" onclick="selectCategory('gk')">🌍 GK & കറന്റ് അഫയേഴ്സ്</button>
            <button class="menu-btn" onclick="showLeaderboard()" style="background-color: #f57c00;">🏆 Leaderboard (സ്കോർ ബോർഡ്)</button>
        </div>

        <!-- ലീഡർബോർഡ് സെക്ഷൻ -->
        <div id="leaderboard-section" style="display: none; text-align: left;">
            <h3 style="color: #f57c00;">🏆 ടോപ് സ്കോറർമാർ (Leaderboard)</h3>
            <div style="max-height: 250px; overflow-y: auto;">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>റാങ്ക്</th>
                            <th>പേര്</th>
                            <th>സ്കോർ</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="3" style="text-align: center;">ലോഡ് ചെയ്യുന്നു...</td></tr>
                    </tbody>
                </table>
            </div>
            <button onclick="goBackToMain()" class="back-btn">പിന്നോട്ട് (Back)</button>
        </div>

        <!-- 2. സബ് സെക്ഷൻ (ക്ലാസുകൾ അല്ലെങ്കിൽ വിഷയങ്ങൾ) -->
        <div id="sub-category-section" style="display: none;">
            <h3 id="sub-title"></h3>
            <div id="sub-items-container" style="max-height: 250px; overflow-y: auto;"></div>
            <br>
            <button onclick="goBackToMain()" class="back-btn">പിന്നോട്ട് (Back)</button>
        </div>

        <!-- 3. പഠനം തുടങ്ങാനുള്ള നിർദ്ദേശം -->
        <div id="intro-box" style="display: none; text-align: center;">
            <h3 id="intro-title">ക്വിസ്</h3>
            <p>ഈ സെക്ഷനിലെ ചോദ്യങ്ങൾക്കും 100% ശരിയായ ഉത്തരം നൽകിയാൽ മാത്രമേ വിജയിക്കൂ!</p>
            <button onclick="startActualQuiz()" style="background-color: #0288d1; padding: 12px; font-size: 16px; border:none; color:white; border-radius:5px; cursor:pointer;">പഠനം തുടങ്ങുക (Start Quiz)</button>
            <br>
            <button onclick="goBackToMain()" class="back-btn">പിന്നോട്ട് (Back)</button>
        </div>

        <!-- 4. ക്വിസ് സെക്ഷൻ -->
        <div id="quiz-box" style="display: none; text-align: left;">
            <div class="q-progress-bar" id="q-dots-container"></div>

            <div class="timer-container">
                <div class="circular-timer" id="timer-circle">
                    <span id="timer-text">20</span>
                </div>
            </div>

            <h3 id="question-title">ചോദ്യം ഇവിടെ വരുന്നു...</h3>
            <div id="options-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
            
            <button onclick="goBackToMain()" class="back-btn" style="margin-top: 15px;">പിന്നോട്ട് (Back)</button>
        </div>

        <div style="text-align: center;">
            <button onclick="logout()" class="small-btn">പുറത്തുപോവുക (Logout)</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const userPhone = localStorage.getItem('userPhone');
        const userIcon = localStorage.getItem('userIcon') || '⭐';

        let userScore = 0;
        let activeQuestions = [];
        let userDocId = "";

        if (!userPhone) window.location.href = "index.html";
        else {
            document.getElementById('user-icon').innerText = userIcon;
            fetchUserData();
        }

        function fetchUserData() {
            db.collection('users').where('phone', '==', userPhone).get().then(snapshot => {
                snapshot.forEach(doc => {
                    userDocId = doc.id;
                    let data = doc.data();
                    userScore = data.score || 0;
                    document.getElementById('welcome-user').innerText = data.name;
                    document.getElementById('user-score-display').innerText = `സ്കോർ: ${userScore}`;
                    localStorage.setItem('userName', data.name);
                });
            });
        }

        function openEditProfile() {
            let currentName = document.getElementById('welcome-user').innerText;
            document.getElementById('new-name-input').value = currentName;
            document.getElementById('edit-profile-box').style.display = 'block';
        }

        function closeEditProfile() {
            document.getElementById('edit-profile-box').style.display = 'none';
        }

        function updateUserName() {
            let newName = document.getElementById('new-name-input').value.trim();
            if(!newName) { alert("ദയവായി പേര് നൽകുക!"); return; }

            if(userDocId) {
                db.collection('users').doc(userDocId).update({ name: newName }).then(() => {
                    alert("പേര് വിജയകരമായി മാറ്റി!");
                    document.getElementById('welcome-user').innerText = newName;
                    localStorage.setItem('userName', newName);
                    closeEditProfile();
                }).catch(err => { alert("എറർ: " + err); });
            }
        }

        function selectCategory(category) {
            document.getElementById('main-category-section').style.display = 'none';
            const subSection = document.getElementById('sub-category-section');
            const subTitle = document.getElementById('sub-title');
            const container = document.getElementById('sub-items-container');
            container.innerHTML = '';
            subSection.style.display = 'block';

            if (category === 'madrasa' || category === 'school') {
                let catName = category === 'madrasa' ? 'മദ്രസ' : 'സ്കൂൾ';
                subTitle.innerText = `${catName} ക്ലാസുകൾ തിരഞ്ഞെടുക്കുക`;
                for (let i = 1; i <= 10; i++) {
                    let btn = document.createElement('button');
                    btn.className = 'menu-btn';
                    btn.innerText = `ക്ലാസ്സ് ${i} (${catName})`;
                    btn.onclick = () => showSubjects(category, i);
                    container.appendChild(btn);
                }
            } else if (category === 'gk') {
                subTitle.innerText = "വിഷയങ്ങൾ തിരഞ്ഞെടുക്കുക";
                db.collection('settings').doc('gk_subjects').get().then(doc => {
                    container.innerHTML = '';
                    if(doc.exists && doc.data().subjects) {
                        doc.data().subjects.forEach(subj => {
                            let btn = document.createElement('button');
                            btn.className = 'menu-btn';
                            btn.innerText = subj;
                            btn.onclick = () => loadQuestionsFromDb('gk', subj);
                            container.appendChild(btn);
                        });
                    } else {
                        container.innerHTML = '<p style="color:red;">വിഷയങ്ങൾ ലഭ്യമല്ല.</p>';
                    }
                });
            }
        }

        function showSubjects(category, classNum) {
            const subTitle = document.getElementById('sub-title');
            const container = document.getElementById('sub-items-container');
            let catName = category === 'madrasa' ? 'മദ്രസ' : 'സ്കൂൾ';
            
            subTitle.innerText = `${catName} - ക്ലാസ്സ് ${classNum} - വിഷയം തിരഞ്ഞെടുക്കുക`;
            container.innerHTML = '<p style="color:#00796b;">ലോഡ് ചെയ്യുന്നു...</p>';

            let docKey = category + '_class_' + classNum;
            let sectionKey = category + '_' + classNum;

            db.collection('settings').doc(docKey).get().then(doc => {
                container.innerHTML = '';
                if (doc.exists && doc.data().subjects && doc.data().subjects.length > 0) {
                    doc.data().subjects.forEach(subj => {
                        let btn = document.createElement('button');
                        btn.className = 'menu-btn';
                        btn.innerText = subj;
                        btn.onclick = () => loadQuestionsFromDb(sectionKey, subj);
                        container.appendChild(btn);
                    });
                } else {
                    container.innerHTML = '<p style="color:red; font-weight:bold;">ഈ ക്ലാസിലേക്ക് അഡ്മിൻ ഇതുവരെ വിഷയങ്ങൾ നൽകിയിട്ടില്ല!</p>';
                }
            }).catch(error => {
                container.innerHTML = '<p style="color:red;">എറർ സംഭവിച്ചു.</p>';
            });
        }

        function showLeaderboard() {
            document.getElementById('main-category-section').style.display = 'none';
            document.getElementById('leaderboard-section').style.display = 'block';
            let tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">ലോഡ് ചെയ്യുന്നു...</td></tr>';

            db.collection('users').where('status', '==', 'approved').orderBy('score', 'desc').limit(10).get().then(snapshot => {
                tbody.innerHTML = '';
                let rank = 1;
                if(snapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">വിവരങ്ങൾ ലഭ്യമല്ല.</td></tr>';
                    return;
                }
                snapshot.forEach(doc => {
                    let d = doc.data();
                    let tr = document.createElement('tr');
                    tr.innerHTML = `<td><b>#${rank}</b></td><td>${d.name}</td><td><b>${d.score || 0}</b></td>`;
                    tbody.appendChild(tr);
                    rank++;
                });
            }).catch(err => {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color:red;">ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്.</td></tr>';
            });
        }

        function goBackToMain() {
            document.getElementById('sub-category-section').style.display = 'none';
            document.getElementById('intro-box').style.display = 'none';
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('leaderboard-section').style.display = 'none';
            document.getElementById('edit-profile-box').style.display = 'none';
            document.getElementById('main-category-section').style.display = 'block';
            clearInterval(timerInterval);
        }

        function loadQuestionsFromDb(sectionKey, subjectName) {
            const subTitle = document.getElementById('sub-title');
            const container = document.getElementById('sub-items-container');
            subTitle.innerText = `${subjectName} - ചോദ്യങ്ങൾ ലോഡ് ചെയ്യുന്നു...`;
            container.innerHTML = '<p style="color:#00796b;">ദയവായി കാത്തിരിക്കുക...</p>';

            db.collection('questions').where('subject', '==', subjectName).get().then(snapshot => {
                let questionsList = [];
                snapshot.forEach(doc => {
                    let row = doc.data();
                    questionsList.push({
                        q: row.Question,
                        options: [row.Option_A, row.Option_B, row.Option_C, row.Option_D],
                        answerText: row.answerText
                    });
                });

                if(questionsList.length > 0) {
                    prepareQuiz(subjectName, questionsList);
                } else {
                    alert("ഈ വിഷയത്തിൽ ചോദ്യങ്ങൾ ലഭ്യമല്ല!");
                    goBackToMain();
                }
            }).catch(err => {
                alert("ചോദ്യങ്ങൾ ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്!");
            });
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function prepareQuiz(title, qList) {
            document.getElementById('sub-category-section').style.display = 'none';
            document.getElementById('intro-box').style.display = 'block';
            document.getElementById('intro-title').innerText = title;
            activeQuestions = shuffleArray([...qList]);
        }

        let timerInterval;
        let questionStatuses = [];

        function setupDots(maxQ) {
            const dotsContainer = document.getElementById('q-dots-container');
            dotsContainer.innerHTML = '';
            for(let i=0; i<maxQ; i++) {
                let dot = document.createElement('div');
                dot.className = `q-dot ${questionStatuses[i] || ''}`;
                dotsContainer.appendChild(dot);
            }
        }

        function startActualQuiz() {
            document.getElementById('intro-box').style.display = 'none';
            document.getElementById('quiz-box').style.display = 'block';

            let currentQIndex = 0;
            let correctAnswersCount = 0;
            let maxQuestions = activeQuestions.length > 10 ? 10 : activeQuestions.length; 
            questionStatuses = Array(maxQuestions).fill('');

            function showQuestion() {
                if (currentQIndex < maxQuestions) {
                    setupDots(maxQuestions);
                    let qData = activeQuestions[currentQIndex];
                    document.getElementById('question-title').innerText = `ചോദ്യം ${currentQIndex + 1}/${maxQuestions}: ${qData.q}`;
                    let optContainer = document.getElementById('options-container');
                    optContainer.innerHTML = '';

                    let shuffledOptions = shuffleArray([...qData.options]);
                    let timeLeft = 20;
                    document.getElementById('timer-text').innerText = timeLeft;
                    updateTimerCircle(timeLeft, 20);

                    clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        document.getElementById('timer-text').innerText = timeLeft;
                        updateTimerCircle(timeLeft, 20);

                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            questionStatuses[currentQIndex] = 'wrong';
                            currentQIndex++;
                            showQuestion();
                        }
                    }, 1000);

                    shuffledOptions.forEach((opt) => {
                        let optBtn = document.createElement('button');
                        optBtn.innerText = opt;
                        optBtn.className = 'menu-btn';
                        optBtn.style.marginBottom = "5px";
                        optBtn.onclick = () => {
                            clearInterval(timerInterval);
                            
                            let selectedOpt = String(opt).trim().toLowerCase();
                            let correctAns = String(qData.answerText).trim().toLowerCase();

                            if (selectedOpt === correctAns) {
                                correctAnswersCount++;
                                questionStatuses[currentQIndex] = 'correct';
                            } else {
                                questionStatuses[currentQIndex] = 'wrong';
                            }
                            currentQIndex++;
                            showQuestion();
                        };
                        optContainer.appendChild(optBtn);
                    });
                } else {
                    clearInterval(timerInterval);
                    setupDots(maxQuestions);
                    evaluateResult(correctAnswersCount, maxQuestions);
                }
            }
            showQuestion();
        }

        function updateTimerCircle(current, total) {
            let degree = (current / total) * 360;
            document.getElementById('timer-circle').style.background = `conic-gradient(#00796b ${degree}deg, #e0e0e0 0deg)`;
        }

        function evaluateResult(scoreCount, total) {
            let percentage = (scoreCount / total) * 100;
            const quizBox = document.getElementById('quiz-box');

            if (scoreCount === total) {
                quizBox.innerHTML = `<h3>🎉 അഭിനന്ദനങ്ങൾ! നിങ്ങൾ വിജയിച്ചു!</h3>
                                    <p>സ്കോർ: ${scoreCount}/${total} (100%)</p>
                                    <button onclick="location.reload()" style="background:#00796b; padding:10px; color:white; border:none; border-radius:5px; cursor:pointer;">മറ്റ് വിഭാഗങ്ങളിലേക്ക് പോവുക</button>`;
                updateScoreToDatabase(scoreCount * 5);
            } else {
                quizBox.innerHTML = `<h3>❌ പരാജയപ്പെട്ടു!</h3>
                                    <p>നിങ്ങൾക്ക് ${scoreCount}/${total} (${percentage}%) മാത്രമേ ലഭിച്ചുള്ളൂ. വിജയിക്കാൻ 100% (എല്ലാ ചോദ്യങ്ങളും) ശരിയായിരിക്കണം.</p>
                                    <button onclick="location.reload()" style="background:#d32f2f; padding:10px; color:white; border:none; border-radius:5px; cursor:pointer;">വീണ്ടും ശ്രമിക്കുക (Try Again)</button>`;
            }
        }

        async function updateScoreToDatabase(addedScore) {
            if(userDocId) {
                db.collection('users').doc(userDocId).update({ score: (userScore + addedScore) });
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
