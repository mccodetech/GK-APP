<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>അഡ്മിൻ പാനൽ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h2>അഡ്മിൻ പാനൽ</h2>
        
        <!-- അഡ്മിൻ ലോഗിൻ ഫോം -->
        <div id="admin-login-box">
            <input type="text" id="admin-user" placeholder="അഡ്മിൻ യൂസർനെയിം (admin)">
            <input type="password" id="admin-pass" placeholder="പാസ്‌വേർഡ് (admin123)">
            <button onclick="loginAdmin()">അഡ്മിൻ ലോഗിൻ</button>
        </div>

        <!-- അപ്പ്രൂവൽ ഡാഷ്‌ബോർഡ് (തുടക്കത്തിൽ മറച്ചുവെച്ചിരിക്കുന്നു) -->
        <div id="admin-dashboard" style="display: none; text-align: left;">
            <h3>പെൻഡിങ് അക്കൗണ്ടുകൾ (Pending Approvals)</h3>
            <ul id="pending-list" style="list-style: none; padding: 0;"></ul>
            
            <h3 style="margin-top: 30px;">Google Sheet വഴി ഡാറ്റ ചേർക്കാൻ</h3>
            <p style="font-size: 14px; color: #555;">Google Sheet ലിങ്ക് നൽകി ഡാറ്റ ഇമ്പോർട്ട് ചെയ്യാം:</p>
            <input type="text" id="sheet-link" placeholder="Google Sheet CSV Link ഇവിടെ നൽകുക">
            <button onclick="importFromSheet()" style="background-color: #0288d1;">ഡാറ്റ ഇമ്പോർട്ട് ചെയ്യുക</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function loginAdmin() {
            let user = document.getElementById('admin-user').value.trim();
            let pass = document.getElementById('admin-pass').value.trim();

            if (user === "admin" && pass === "admin123") {
                document.getElementById('admin-login-box').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadPendingUsers();
            } else {
                alert("തെറ്റായ യൂസർനെയിം അല്ലെങ്കിൽ പാസ്‌വേർഡ്!");
            }
        }

        function loadPendingUsers() {
            const list = document.getElementById('pending-list');
            db.collection('users').where('status', '==', 'pending').get().then(snapshot => {
                list.innerHTML = '';
                if(snapshot.empty) {
                    list.innerHTML = '<li>പെൻഡിങ് അക്കൗണ്ടുകൾ ഒന്നുമില്ല.</li>';
                    return;
                }
                snapshot.forEach(doc => {
                    let data = doc.data();
                    let li = document.createElement('li');
                    li.style.margin = "10px 0";
                    li.style.padding = "10px";
                    li.style.background = "#f9f9f9";
                    li.style.border = "1px solid #ddd";
                    li.innerHTML = `<b>${data.name}</b> (${data.phone}) 
                        <button onclick="approveUser('${doc.id}')" style="float: right; width: auto; padding: 5px 10px; background: green; margin-top:-5px;">അപ്പ്രൂവ് ചെയ്യുക</button>`;
                    list.appendChild(li);
                });
            });
        }

        function approveUser(docId) {
            db.collection('users').doc(docId).update({
                status: 'approved'
            }).then(() => {
                alert("വിജയകരമായി അപ്പ്രൂവ് ചെയ്തു!");
                loadPendingUsers();
            });
        }

        function importFromSheet() {
            let url = document.getElementById('sheet-link').value.trim();
            if(!url) {
                alert("ദയവായി ഗൂഗിൾ ഷീറ്റ് ലിങ്ക് നൽകുക!");
                return;
            }
            // Google Sheet CSV ലിങ്ക് വഴി ഡാറ്റ ഫെച്ച് ചെയ്ത് ഫയർബേസിലേക്ക് ആഡ് ചെയ്യാനുള്ള കോഡ്
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    alert("ഡാറ്റ വിജയകരമായി റീഡ് ചെയ്തു! (റൊട്ടേഷൻ പ്രക്രിയ നടപ്പിലാക്കാം)");
                })
                .catch(err => alert("എറർ: " + err));
        }
    </script>
</body>
</html>
