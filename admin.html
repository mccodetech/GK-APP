<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>അഡ്മിൻ പാനൽ - ക്വിസ് ആപ്പ്</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .admin-container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .admin-section { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #e0e0e0; text-align: left; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #333; }
        .input-group select, .input-group input, .input-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        .row-group { display: flex; gap: 10px; }
        .row-group .input-group { flex: 1; }
        .question-card { background: #fff; padding: 12px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 6px; font-size: 14px; }
        .action-btn { padding: 6px 12px; font-size: 13px; cursor: pointer; border: none; border-radius: 4px; color: white; margin-right: 5px; }
        @media (max-width: 600px) { .row-group { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2 style="color: #00796b; text-align: center; margin-top: 0;">അഡ്മിൻ പാനൽ</h2>
        
        <!-- അഡ്മിൻ ലോഗിൻ -->
        <div id="admin-login-box" style="max-width: 400px; margin: 40px auto; text-align: center;">
            <input type="text" id="admin-user" placeholder="അഡ്മിൻ യൂസർനെയിം (admin)" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="password" id="admin-pass" placeholder="പാസ്‌വേർഡ് (admin123)" style="width:100%; padding:10px; margin-bottom:10px;">
            <button onclick="loginAdmin()" style="width:100%; padding:10px; background:#00796b; color:white; border:none; border-radius:5px; cursor:pointer;">അഡ്മിൻ ലോഗിൻ</button>
        </div>

        <!-- അഡ്മിൻ ഡാഷ്‌ബോർഡ് -->
        <div id="admin-dashboard" style="display: none;">
            
            <!-- പെൻഡിങ് അക്കൗണ്ടുകൾ -->
            <div class="admin-section">
                <h3 style="color: #d32f2f; margin-top: 0;">പെൻഡിങ് അക്കൗണ്ടുകൾ</h3>
                <ul id="pending-list" style="list-style: none; padding: 0;"></ul>
            </div>

            <!-- വിഷയങ്ങൾ ക്രമീകരിക്കാൻ -->
            <div class="admin-section">
                <h3 style="color: #00796b; margin-top: 0;">വിഷയങ്ങൾ ക്രമീകരിക്കുക</h3>
                <div class="row-group">
                    <div class="input-group">
                        <label>വിഭാഗം:</label>
                        <select id="sub-category" onchange="updateDropdowns()">
                            <option value="madrasa">മദ്രസ</option>
                            <option value="school">സ്കൂൾ</option>
                            <option value="gk">GK & Current Affairs</option>
                        </select>
                    </div>
                    <div class="input-group" id="class-div">
                        <label>ക്ലാസ്സ്:</label>
                        <select id="sub-class" onchange="loadSubjectsList()">
                            <option value="1">ക്ലാസ്സ് 1</option><option value="2">ക്ലാസ്സ് 2</option><option value="3">ക്ലാസ്സ് 3</option>
                            <option value="4">ക്ലാസ്സ് 4</option><option value="5">ക്ലാസ്സ് 5</option><option value="6">ക്ലാസ്സ് 6</option>
                            <option value="7">ക്ലാസ്സ് 7</option><option value="8">ക്ലാസ്സ് 8</option><option value="9">ക്ലാസ്സ് 9</option><option value="10">ക്ലാസ്സ് 10</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>വിഷയങ്ങൾ (കോമ ഇട്ട് നൽകുക):</label>
                    <input type="text" id="subject-names" placeholder="ഉദാ: ഖുർആൻ, ഫിഖ്ഹ്">
                </div>
                <button onclick="saveSubjects()" style="background-color: #0288d1; padding: 10px 20px; color:white; border:none; border-radius:5px; cursor:pointer;">വിഷയങ്ങൾ സേവ് ചെയ്യുക</button>
            </div>

            <!-- 1. ഗൂഗിൾ ഷീറ്റ് വഴി ചോദ്യങ്ങൾ ഇമ്പോർട്ട് ചെയ്യാൻ -->
            <div class="admin-section">
                <h3 style="color: #388e3c; margin-top: 0;">ഗൂഗിൾ ഷീറ്റ് വഴി ചോദ്യങ്ങൾ ചേർക്കാൻ</h3>
                <div class="row-group">
                    <div class="input-group">
                        <label>വിഭാഗം:</label>
                        <select id="imp-category" onchange="updateImpDropdowns()">
                            <option value="madrasa">മദ്രസ</option>
                            <option value="school">സ്കൂൾ</option>
                            <option value="gk">GK & Current Affairs</option>
                        </select>
                    </div>
                    <div class="input-group" id="imp-class-div">
                        <label>ക്ലാസ്സ്:</label>
                        <select id="imp-class" onchange="loadImpSubjects()">
                            <option value="1">ക്ലാസ്സ് 1</option><option value="2">ക്ലാസ്സ് 2</option><option value="3">ക്ലാസ്സ് 3</option>
                            <option value="4">ക്ലാസ്സ് 4</option><option value="5">ക്ലാസ്സ് 5</option><option value="6">ക്ലാസ്സ് 6</option>
                            <option value="7">ക്ലാസ്സ് 7</option><option value="8">ക്ലാസ്സ് 8</option><option value="9">ക്ലാസ്സ് 9</option><option value="10">ക്ലാസ്സ് 10</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>വിഷയം തിരഞ്ഞെടുക്കുക:</label>
                    <select id="q-subject-name"></select>
                </div>
                <div class="input-group">
                    <label>Google Sheet CSV Link:</label>
                    <input type="text" id="csv-link" placeholder="https://docs.google.com/spreadsheets/.../pub?output=csv">
                </div>
                <button onclick="importQuestionsFromCSV()" style="background-color: #388e3c; padding: 10px 20px; color:white; border:none; border-radius:5px; cursor:pointer;">ചോദ്യങ്ങൾ ഇമ്പോർട്ട് ചെയ്യുക</button>
            </div>

            <!-- 2. മാന്വലായി ചോദ്യം ചേർക്കാൻ / എഡിറ്റ് ചെയ്യാൻ -->
            <div class="admin-section">
                <h3 style="color: #e65100; margin-top: 0;" id="form-title">പുതിയ ചോദ്യം മാന്വലായി ചേർക്കാൻ</h3>
                <input type="hidden" id="edit-doc-id">
                
                <div class="row-group">
                    <div class="input-group">
                        <label>വിഭാഗം:</label>
                        <select id="man-category" onchange="updateManDropdowns()">
                            <option value="madrasa">മദ്രസ</option>
                            <option value="school">സ്കൂൾ</option>
                            <option value="gk">GK & Current Affairs</option>
                        </select>
                    </div>
                    <div class="input-group" id="man-class-div">
                        <label>ക്ലാസ്സ്:</label>
                        <select id="man-class" onchange="loadManSubjects()">
                            <option value="1">ക്ലാസ്സ് 1</option><option value="2">ക്ലാസ്സ് 2</option><option value="3">ക്ലാസ്സ് 3</option>
                            <option value="4">ക്ലാസ്സ് 4</option><option value="5">ക്ലാസ്സ് 5</option><option value="6">ക്ലാസ്സ് 6</option>
                            <option value="7">ക്ലാസ്സ് 7</option><option value="8">ക്ലാസ്സ് 8</option><option value="9">ക്ലാസ്സ് 9</option><option value="10">ക്ലാസ്സ് 10</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>വിഷയം തിരഞ്ഞെടുക്കുക:</label>
                    <select id="manual-subject"></select>
                </div>
                <div class="input-group">
                    <label>ചോദ്യം:</label>
                    <textarea id="manual-q" rows="2" placeholder="ചോദ്യം ഇവിടെ എഴുതുക"></textarea>
                </div>
                <div class="row-group">
                    <div class="input-group"><input type="text" id="manual-opt1" placeholder="ഓപ്ഷൻ A"></div>
                    <div class="input-group"><input type="text" id="manual-opt2" placeholder="ഓപ്ഷൻ B"></div>
                </div>
                <div class="row-group">
                    <div class="input-group"><input type="text" id="manual-opt3" placeholder="ഓപ്ഷൻ C"></div>
                    <div class="input-group"><input type="text" id="manual-opt4" placeholder="ഓപ്ഷൻ D"></div>
                </div>
                <div class="input-group">
                    <label>ശരിയായ ഉത്തരം (Option തിരഞ്ഞെടുക്കുക):</label>
                    <select id="manual-ans">
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                </div>
                <button id="save-q-btn" onclick="saveManualQuestion()" style="background-color: #e65100; padding: 10px 20px; color:white; border:none; border-radius:5px; cursor:pointer;">ചോദ്യം സേവ് ചെയ്യുക</button>
            </div>

            <!-- നിലവിലുള്ള ചോദ്യങ്ങൾ മാനേജ് ചെയ്യാൻ -->
            <div class="admin-section">
                <h3 style="color: #4527a0; margin-top: 0;">ചോദ്യങ്ങൾ മാനേജ് ചെയ്യുക (Manage Questions)</h3>
                <div class="row-group">
                    <div class="input-group">
                        <label>വിഭാഗം:</label>
                        <select id="mng-category" onchange="updateMngDropdowns()">
                            <option value="madrasa">മദ്രസ</option>
                            <option value="school">സ്കൂൾ</option>
                            <option value="gk">GK & Current Affairs</option>
                        </select>
                    </div>
                    <div class="input-group" id="mng-class-div">
                        <label>ക്ലാസ്സ്:</label>
                        <select id="mng-class" onchange="loadMngSubjects()">
                            <option value="1">ക്ലാസ്സ് 1</option><option value="2">ക്ലാസ്സ് 2</option><option value="3">ക്ലാസ്സ് 3</option>
                            <option value="4">ക്ലാസ്സ് 4</option><option value="5">ക്ലാസ്സ് 5</option><option value="6">ക്ലാസ്സ് 6</option>
                            <option value="7">ക്ലാസ്സ് 7</option><option value="8">ക്ലാസ്സ് 8</option><option value="9">ക്ലാസ്സ് 9</option><option value="10">ക്ലാസ്സ് 10</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>വിഷയം തിരഞ്ഞെടുക്കുക:</label>
                    <select id="search-subject" onchange="loadQuestionsForManagement()"></select>
                </div>
                <div id="questions-manage-container" style="max-height: 300px; overflow-y: auto;">
                    <p style="color: #775;">വിഷയം തിരഞ്ഞെടുതാൽ ചോദ്യങ്ങൾ ഇവിടെ കാണാം.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function loginAdmin() {
            let user = document.getElementById('admin-user').value.trim();
            let pass = document.getElementById('admin-pass').value.trim();
            if (user === "admin" && pass === "admin123") {
                document.getElementById('admin-login-box').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadPendingUsersLive();
                loadImpSubjects();
                loadManSubjects();
                loadMngSubjects();
            } else {
                alert("തെറ്റായ യൂസർനെയിം അല്ലെങ്കിൽ പാസ്‌വേർഡ്!");
            }
        }

        function loadPendingUsersLive() {
            const list = document.getElementById('pending-list');
            db.collection('users').where('status', '==', 'pending').onSnapshot(snapshot => {
                list.innerHTML = '';
                if(snapshot.empty) { list.innerHTML = '<li>പെൻഡിങ് അക്കൗണ്ടുകൾ ഒന്നുമില്ല.</li>'; return; }
                snapshot.forEach(doc => {
                    let data = doc.data();
                    let li = document.createElement('li');
                    li.style.margin = "8px 0"; li.style.padding = "10px"; li.style.background = "#fff"; li.style.border = "1px solid #ddd";
                    li.innerHTML = `<b>${data.name}</b> (${data.phone}) 
                        <button onclick="approveUser('${doc.id}')" style="float: right; padding: 4px 8px; background: green; color:white; border:none; cursor:pointer; border-radius:3px;">അപ്പ്രൂവ്</button>`;
                    list.appendChild(li);
                });
            });
        }

        function approveUser(docId) { db.collection('users').doc(docId).update({ status: 'approved' }); }

        function updateDropdowns() {
            let cat = document.getElementById('sub-category').value;
            document.getElementById('class-div').style.display = (cat === 'gk') ? 'none' : 'block';
        }
        function updateImpDropdowns() {
            let cat = document.getElementById('imp-category').value;
            document.getElementById('imp-class-div').style.display = (cat === 'gk') ? 'none' : 'block';
            loadImpSubjects();
        }
        function updateManDropdowns() {
            let cat = document.getElementById('man-category').value;
            document.getElementById('man-class-div').style.display = (cat === 'gk') ? 'none' : 'block';
            loadManSubjects();
        }
        function updateMngDropdowns() {
            let cat = document.getElementById('mng-category').value;
            document.getElementById('mng-class-div').style.display = (cat === 'gk') ? 'none' : 'block';
            loadMngSubjects();
        }

        function loadSubjectsToDropdown(catId, classId, dropdownId) {
            let cat = document.getElementById(catId).value;
            let classNum = document.getElementById(classId).value;
            let docKey = (cat === 'gk') ? 'gk_subjects' : (cat + '_class_' + classNum);
            let dropdown = document.getElementById(dropdownId);

            db.collection('settings').doc(docKey).get().then(doc => {
                dropdown.innerHTML = '';
                if(doc.exists && doc.data().subjects) {
                    doc.data().subjects.forEach(sub => {
                        let opt = document.createElement('option');
                        opt.value = sub; opt.innerText = sub;
                        dropdown.appendChild(opt);
                    });
                } else {
                    let opt = document.createElement('option');
                    opt.value = ""; opt.innerText = "വിഷയങ്ങൾ ലഭ്യമല്ല";
                    dropdown.appendChild(opt);
                }
            });
        }

        function loadImpSubjects() { loadSubjectsToDropdown('imp-category', 'imp-class', 'q-subject-name'); }
        function loadManSubjects() { loadSubjectsToDropdown('man-category', 'man-class', 'manual-subject'); }
        function loadMngSubjects() { loadSubjectsToDropdown('mng-category', 'mng-class', 'search-subject'); setTimeout(loadQuestionsForManagement, 300); }

        function saveSubjects() {
            let category = document.getElementById('sub-category').value;
            let classNum = document.getElementById('sub-class').value;
            let subjectsRaw = document.getElementById('subject-names').value;

            if(!subjectsRaw.trim()) { alert("ദയവായി വിഷയങ്ങൾ നൽകുക!"); return; }
            let subjectsArray = subjectsRaw.split(',').map(s => s.trim()).filter(s => s !== "");
            let docKey = (category === 'gk') ? 'gk_subjects' : (category + '_class_' + classNum);

            db.collection('settings').doc(docKey).set({ subjects: subjectsArray }).then(() => {
                alert("വിഷയങ്ങൾ വിജയകരമായി സേവ് ചെയ്തു!");
                document.getElementById('subject-names').value = '';
                loadImpSubjects(); loadManSubjects(); loadMngSubjects();
            });
        }

        function getCorrectAnswerTextFromRow(row) {
            let ansKey = String(row.Correct_Answer || '').trim().toUpperCase();
            if (ansKey === 'A') return row.Option_A;
            if (ansKey === 'B') return row.Option_B;
            if (ansKey === 'C') return row.Option_C;
            if (ansKey === 'D') return row.Option_D;
            return row.Correct_Answer;
        }

        function importQuestionsFromCSV() {
            let category = document.getElementById('imp-category').value;
            let classNum = document.getElementById('imp-class').value;
            let subjectName = document.getElementById('q-subject-name').value;
            let url = document.getElementById('csv-link').value.trim();

            if(!subjectName || !url) { alert("വിഷയവും ലിങ്കും നൽകുക!"); return; }
            let sectionKey = (category === 'gk') ? 'gk' : (category + '_' + classNum);

            fetch(url).then(res => res.text()).then(data => {
                let rows = data.split('\n');
                let count = 0;
                for(let i = 1; i < rows.length; i++) {
                    let rowText = rows[i].trim();
                    if(rowText) {
                        let cols = rowText.split(',');
                        if(cols.length >= 6) {
                            let qObj = {
                                Question: cols[0].replace(/^"|"$/g, '').trim(),
                                Option_A: cols[1].replace(/^"|"$/g, '').trim(),
                                Option_B: cols[2].replace(/^"|"$/g, '').trim(),
                                Option_C: cols[3].replace(/^"|"$/g, '').trim(),
                                Option_D: cols[4].replace(/^"|"$/g, '').trim(),
                                Correct_Answer: cols[5].replace(/^"|"$/g, '').trim()
                            };
                            db.collection('questions').add({
                                section: sectionKey,
                                subject: subjectName,
                                Question: qObj.Question,
                                Option_A: qObj.Option_A,
                                Option_B: qObj.Option_B,
                                Option_C: qObj.Option_C,
                                Option_D: qObj.Option_D,
                                answerText: getCorrectAnswerTextFromRow(qObj)
                            });
                            count++;
                        }
                    }
                }
                alert(`${count} ചോദ്യങ്ങൾ വിജയകരമായി അപ്‌ലോഡ് ചെയ്തു!`);
                document.getElementById('csv-link').value = '';
            }).catch(err => alert("എറർ: " + err));
        }

        function saveManualQuestion() {
            let docId = document.getElementById('edit-doc-id').value;
            let category = document.getElementById('man-category').value;
            let classNum = document.getElementById('man-class').value;
            let subject = document.getElementById('manual-subject').value;
            let Question = document.getElementById('manual-q').value.trim();
            let Option_A = document.getElementById('manual-opt1').value.trim();
            let Option_B = document.getElementById('manual-opt2').value.trim();
            let Option_C = document.getElementById('manual-opt3').value.trim();
            let Option_D = document.getElementById('manual-opt4').value.trim();
            let ansOption = document.getElementById('manual-ans').value;

            if(!subject || !Question || !Option_A || !Option_B) { alert("എല്ലാ വിവരങ്ങളും നൽകുക!"); return; }

            let answerText = Option_A;
            if(ansOption === 'B') answerText = Option_B;
            if(ansOption === 'C') answerText = Option_C;
            if(ansOption === 'D') answerText = Option_D;

            let sectionKey = (category === 'gk') ? 'gk' : (category + '_' + classNum);
            let dataObj = { section: sectionKey, subject, Question, Option_A, Option_B, Option_C, Option_D, answerText };

            if(docId) {
                db.collection('questions').doc(docId).update(dataObj).then(() => { alert("ചോദ്യം അപ്ഡേറ്റ് ചെയ്തു!"); resetForm(); });
            } else {
                db.collection('questions').add(dataObj).then(() => { alert("ചോദ്യം ചേർത്തു!"); resetForm(); });
            }
        }

        function resetForm() {
            document.getElementById('edit-doc-id').value = '';
            document.getElementById('manual-q').value = '';
            document.getElementById('manual-opt1').value = '';
            document.getElementById('manual-opt2').value = '';
            document.getElementById('manual-opt3').value = '';
            document.getElementById('manual-opt4').value = '';
            document.getElementById('form-title').innerText = "പുതിയ ചോദ്യം മാന്വലായി ചേർക്കാൻ";
            document.getElementById('save-q-btn').innerText = "ചോദ്യം സേവ് ചെയ്യുക";
            loadManSubjects();
        }

        function loadQuestionsForManagement() {
            let searchSubj = document.getElementById('search-subject').value;
            let container = document.getElementById('questions-manage-container');
            if(!searchSubj) { container.innerHTML = '<p>വിഷയങ്ങൾ ലഭ്യമല്ല.</p>'; return; }

            db.collection('questions').where('subject', '==', searchSubj).get().then(snapshot => {
                container.innerHTML = '';
                if(snapshot.empty) { container.innerHTML = '<p style="color:red;">ഈ വിഷയത്തിൽ ചോദ്യങ്ങൾ ഒന്നും കണ്ടെത്തിയില്ല.</p>'; return; }
                
                snapshot.forEach(doc => {
                    let d = doc.data();
                    let card = document.createElement('div');
                    card.className = 'question-card';
                    card.innerHTML = `<b>ചോദ്യം:</b> ${d.Question} <br><b>ഉത്തരം:</b> ${d.answerText} <br><br>
                        <button class="action-btn" style="background:#0288d1;" onclick="editQuestion('${doc.id}', '${d.subject}', '${d.Question}', '${d.Option_A}', '${d.Option_B}', '${d.Option_C}', '${d.Option_D}')">എഡിറ്റ്</button>
                        <button class="action-btn" style="background:#d32f2f;" onclick="deleteQuestion('${doc.id}')">ഡിലീറ്റ്</button>`;
                    container.appendChild(card);
                });
            });
        }

        function editQuestion(id, sub, q, o1, o2, o3, o4) {
            document.getElementById('edit-doc-id').value = id;
            document.getElementById('manual-subject').value = sub;
            document.getElementById('manual-q').value = q;
            document.getElementById('manual-opt1').value = o1;
            document.getElementById('manual-opt2').value = o2;
            document.getElementById('manual-opt3').value = o3;
            document.getElementById('manual-opt4').value = o4;
            document.getElementById('form-title').innerText = "ചോദ്യം എഡിറ്റ് ചെയ്യുക";
            document.getElementById('save-q-btn').innerText = "അപ്ഡേറ്റ് ചെയ്യുക";
            window.scrollTo({ top: 500, behavior: 'smooth' });
        }

        function deleteQuestion(id) {
            if(confirm("ഈ ചോദ്യം ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                db.collection('questions').doc(id).delete().then(() => {
                    alert("ചോദ്യം ഡിലീറ്റ് ചെയ്തു!");
                    loadQuestionsForManagement();
                });
            }
        }
    </script>
</body>
</html>
