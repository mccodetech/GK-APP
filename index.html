<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>പഠന ആപ്പ് - ലോഗിൻ / രജിസ്ട്രേഷൻ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .icon-btn { font-size: 24px; padding: 8px; cursor: pointer; border: 2px solid #ccc; background: #fff; border-radius: 8px; text-align: center; }
        .icon-btn.selected { border-color: #00796b; background: #e0f2f1; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ലോഗിൻ / രജിസ്ട്രേഷൻ</h2>
        
        <div id="form-box">
            <input type="text" id="name" placeholder="കുട്ടിയുടെ പേര് (Name)" required>
            <input type="tel" id="phone" placeholder="മൊബൈൽ നമ്പർ (Mobile Number)" required>
            
            <p style="margin: 10px 0 5px 0; font-size: 14px; text-align: left;">നിങ്ങളുടെ ഇഷ്ട ഐക്കൺ തിരഞ്ഞെടുക്കുക:</p>
            <div class="icon-grid" id="icon-selector">
                <div class="icon-btn selected" onclick="selectIcon('⭐', this)">⭐</div>
                <div class="icon-btn" onclick="selectIcon('👦', this)">👦</div>
                <div class="icon-btn" onclick="selectIcon('👧', this)">👧</div>
                <div class="icon-btn" onclick="selectIcon('📚', this)">📚</div>
                <div class="icon-btn" onclick="selectIcon('🖊️', this)">🖊️</div>
                <div class="icon-btn" onclick="selectIcon('🏆', this)">🏆</div>
                <div class="icon-btn" onclick="selectIcon('💡', this)">💡</div>
                <div class="icon-btn" onclick="selectIcon('🚀', this)">🚀</div>
            </div>

            <button onclick="handleLoginRegister()">തുടരുക / രജിസ്റ്റർ ചെയ്യുക</button>
        </div>

        <p id="status-message" class="message"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let selectedUserIcon = '⭐';

        function selectIcon(icon, element) {
            document.querySelectorAll('.icon-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            selectedUserIcon = icon;
        }

        async function handleLoginRegister() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const messageBox = document.getElementById('status-message');

            if (!phone) {
                messageBox.innerText = "ദയവായി മൊബൈൽ നമ്പർ നൽകുക!";
                return;
            }

            const usersRef = db.collection('users');
            const snapshot = await usersRef.where('phone', '==', phone).get();

            if (snapshot.empty) {
                if (!name) {
                    messageBox.innerText = "പുതിയ യൂസറാണ്, ദയവായി പേര് കൂടി നൽകുക!";
                    return;
                }

                await usersRef.add({
                    name: name,
                    phone: phone,
                    status: 'pending',
                    score: 0,
                    currentLevel: 1,
                    icon: selectedUserIcon
                });

                messageBox.style.color = "#00796b";
                messageBox.innerText = "രജിസ്ട്രേഷൻ വിജയകരമായി! അഡ്മിന്റെ അപ്പ്രൂവലിനായി കാത്തിരിക്കുക.";
            } else {
                let userData = null;
                snapshot.forEach(doc => {
                    userData = doc.data();
                });

                if (userData.status === 'approved') {
                    messageBox.style.color = "#00796b";
                    messageBox.innerText = "ലോഗിൻ വിജയം! ഹോം പേജിലേക്ക് പോകുന്നു...";
                    localStorage.setItem('userPhone', phone);
                    localStorage.setItem('userName', userData.name);
                    localStorage.setItem('userIcon', userData.icon || '⭐');
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                } else {
                    messageBox.style.color = "#d32f2f";
                    messageBox.innerText = "നിങ്ങളുടെ അക്കൗണ്ട് അഡ്മിൻ ഇതുവരെ അപ്പ്രൂവ് ചെയ്തിട്ടില്ല.";
                }
            }
        }
    </script>
</body>
</html>
