<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Academy - Login</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 420px; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border: 1px solid #e0e0e0; text-align: center; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13px; color: #333; }
        .input-group input { width: 100%; padding: 12px 16px; border-radius: 25px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.2s; background: #fafafa; }
        .input-group input:focus { border-color: #00796b; background: #fff; box-shadow: 0 0 5px rgba(0,121,107,0.2); }
        .submit-btn { width: 100%; padding: 14px; background-color: #00796b; color: white; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,121,107,0.3); }
        .submit-btn:hover { background-color: #004d40; }
        .icon-box { border: 2px dashed #00796b; padding: 12px; border-radius: 20px; margin-bottom: 20px; background: #e0f2f1; cursor: pointer; display: inline-block; font-size: 24px; }
        @media (max-width: 480px) {
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #00796b; margin-top: 0; font-size: 24px;">Smart Academy</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">ലോഗിൻ / രജിസ്ട്രേഷൻ</p>
        
        <div class="input-group">
            <label>കുട്ടിയുടെ പേര് (Name):</label>
            <input type="text" id="user-name" placeholder="പേര് ഇവിടെ എഴുതുക">
        </div>

        <div class="input-group">
            <label>മൊബൈൽ നമ്പർ (Mobile Number):</label>
            <input type="tel" id="user-phone" placeholder="നമ്പർ ഇവിടെ നൽകുക">
        </div>

        <div style="margin-bottom: 20px; text-align: left;">
            <label style="font-size: 13px; font-weight: bold; color: #333; display: block; margin-bottom: 6px;">പ്രൊഫൈൽ ഐക്കൺ തിരഞ്ഞെടുക്കുക:</label>
            <div class="icon-box" onclick="changeIcon()" id="selected-icon-display">⭐</div>
        </div>

        <button class="submit-btn" onclick="handleLogin()">തുടരുക / രജിസ്റ്റർ ചെയ്യുക</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ഓട്ടോ ലോഗിൻ പരിശോധന: ഫോൺ നമ്പർ നേരത്തെ ഉണ്ടെങ്കിൽ ഡാഷ്‌ബോർഡിലേക്ക് നേരിട്ട് പോകും
        const savedPhone = localStorage.getItem('userPhone');
        if (savedPhone) {
            window.location.href = "dashboard.html";
        }

        const icons = ['⭐', '🍎', '⚽', '🚀', '📚', '🎨', '🦁', '🏆'];
        let currentIconIndex = 0;

        function changeIcon() {
            currentIconIndex = (currentIconIndex + 1) % icons.length;
            document.getElementById('selected-icon-display').innerText = icons[currentIconIndex];
        }

        function handleLogin() {
            let name = document.getElementById('user-name').value.trim();
            let phone = document.getElementById('user-phone').value.trim();
            let icon = icons[currentIconIndex];

            if (!name || !phone) {
                alert("ദയവായി പേരും മൊബൈൽ നമ്പറും നൽകുക!");
                return;
            }

            db.collection('users').where('phone', '==', phone).get().then(snapshot => {
                if (!snapshot.empty) {
                    // അക്കൗണ്ട് നിലവിലുണ്ട്, നേരിട്ട് ലോഗിൻ ചെയ്യുന്നു
                    let docId = snapshot.docs[0].id;
                    db.collection('users').doc(docId).update({ status: 'approved' }).then(() => {
                        localStorage.setItem('userPhone', phone);
                        localStorage.setItem('userName', name);
                        localStorage.setItem('userIcon', icon);
                        window.location.href = "dashboard.html";
                    });
                } else {
                    // പുതിയ അക്കൗണ്ട് രജിസ്റ്റർ ചെയ്യുന്നു
                    db.collection('users').add({
                        name: name,
                        phone: phone,
                        score: 0,
                        status: 'approved', // ആദ്യതവണ തന്നെ അപ്പ്രൂവ് ആകുന്നു
                        progress: {}
                    }).then(() => {
                        localStorage.setItem('userPhone', phone);
                        localStorage.setItem('userName', name);
                        localStorage.setItem('userIcon', icon);
                        window.location.href = "dashboard.html";
                    }).catch(err => {
                        alert("എറർ സംഭവിച്ചു: " + err);
                    });
                }
            });
        }
    </script>
</body>
</html>
