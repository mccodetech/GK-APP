<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Academy - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .icon-select-btn { width: 100%; padding: 12px; background: #fff; border: 2px dashed #00796b; border-radius: 6px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; font-weight: bold; color: #00796b; }
        
        /* പോപ്പ്-അപ്പ് മോഡൽ സ്റ്റൈൽ */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 320px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 200px; overflow-y: auto; padding: 10px 0; }
        .icon-option { font-size: 28px; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; text-align: center; }
        .icon-option:hover { background: #e0f2f1; border-color: #00796b; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 450px; text-align: center;">
        
        <!-- ആപ്പിന്റെ പേര് ഇംഗ്ലീഷിൽ മാത്രം -->
        <h2 style="color: #00796b; margin-top: 0;">Smart Academy</h2>
        <h3 style="color: #555; margin-bottom: 20px;">ലോഗിൻ / രജിസ്ട്രേഷൻ</h3>

        <div style="text-align: left;">
            <div class="input-group" style="margin-bottom: 12px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">കുട്ടിയുടെ പേര് (Name)</label>
                <input type="text" id="user-name" placeholder="പേര് ഇവിടെ എഴുതുക" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>

            <div class="input-group" style="margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">മൊബൈൽ നമ്പർ (Mobile Number)</label>
                <input type="text" id="user-phone" placeholder="നമ്പർ ഇവിടെ നൽകുക" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>

            <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; text-align: left;">നിങ്ങളുടെ പ്രൊഫൈൽ ഐക്കൺ തിരഞ്ഞെടുക്കുക:</label>
            
            <!-- ഐക്കൺ തിരഞ്ഞെടുക്കാനുള്ള മെയിൻ ബട്ടൺ -->
            <button type="button" class="icon-select-btn" onclick="openIconModal()">
                <span id="selected-icon-display" style="font-size: 24px;">⭐</span> 
                <span id="selected-icon-text">ഐക്കൺ മാറ്റാൻ ഇവിടെ ക്ലിക്ക് ചെയ്യുക</span>
            </button>
        </div>

        <button onclick="handleLogin()" style="width: 100%; background-color: #00796b; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold;">തുടരുക / രജിസ്റ്റർ ചെയ്യുക</button>
    </div>

    <!-- പോപ്പ്-അപ്പ് വിൻഡോ (Popup Modal for Icons) -->
    <div id="icon-modal" class="modal">
        <div class="modal-content">
            <h4 style="margin-top: 0; color: #00796b;">നിങ്ങൾക്ക് ഇഷ്ടമുള്ള ഐക്കൺ തിരഞ്ഞെടുക്കുക</h4>
            <div class="icon-grid" id="icon-grid-container">
                <!-- ജാവാസ്ക്രിപ്റ്റ് വഴി ഐക്കണുകൾ ഇവിടെ ലോഡ് ആകും -->
            </div>
            <button onclick="closeIconModal()" style="margin-top: 15px; background: #d32f2f; color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer;">ക്ലോസ് ചെയ്യുക</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxKaF7sFUCsbcyZ9FkQxZtpvBL5Ga-yew",
            authDomain: "gk-app-2274e.firebaseapp.com",
            projectId: "gk-app-2274e",
            storageBucket: "gk-app-2274e.firebasestorage.app",
            messagingSenderId: "249982405152",
            appId: "1:249982405152:web:dd441a778ab94d86078a45",
            measurementId: "G-50X2DDE274"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ലഭ്യമായ ഒരുപാട് ഐക്കണുകളുടെ ലിസ്റ്റ് (ഇതുപോലെ എത്ര വേണമെങ്കിലും കൂട്ടാം)
        const availableIcons = ['⭐', '👦', '👧', '📚', '✏️', '🏆', '💡', '🚀', '🐱', '🐶', '🍎', '⚽', '🎨', '💻', '👑', '🎯', '🦁', '🚗', '🌺', '⚡'];
        let selectedIcon = '⭐';

        // പേജ് ലോഡ് ചെയ്യുമ്പോൾ ഐക്കണുകൾ ഗ്രീഡിലേക്ക് നിറയ്ക്കുന്നു
        window.onload = function() {
            const gridContainer = document.getElementById('icon-grid-container');
            gridContainer.innerHTML = '';
            availableIcons.forEach(icon => {
                let div = document.createElement('div');
                div.className = 'icon-option';
                div.innerText = icon;
                div.onclick = () => selectThisIcon(icon);
                gridContainer.appendChild(div);
            });
        };

        function openIconModal() {
            document.getElementById('icon-modal').style.display = 'flex';
        }

        function closeIconModal() {
            document.getElementById('icon-modal').style.display = 'none';
        }

        function selectThisIcon(icon) {
            selectedIcon = icon;
            document.getElementById('selected-icon-display').innerText = icon;
            document.getElementById('selected-icon-text').innerText = "ഐക്കൺ തിരഞ്ഞെടുത്തിരിക്കുന്നു";
            closeIconModal();
        }

        function handleLogin() {
            let name = document.getElementById('user-name').value.trim();
            let phone = document.getElementById('user-phone').value.trim();

            if (!name || !phone) {
                alert("ദയവായി പേരും മൊബൈൽ നമ്പറും നൽകുക!");
                return;
            }

            db.collection('users').where('phone', '==', phone).get().then(snapshot => {
                if (snapshot.empty) {
                    // പുതിയ അക്കൗണ്ട് രജിസ്റ്റർ ചെയ്യുന്നു (Pending Status)
                    db.collection('users').add({
                        name: name,
                        phone: phone,
                        icon: selectedIcon,
                        score: 0,
                        status: 'pending',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).then(() => {
                        alert("രജിസ്ട്രേഷൻ വിജയകരമായി പൂർത്തിയായി! അഡ്മിൻ അപ്പ്രൂവ് ചെയ്യുന്നതുവരെ കാത്തിരിക്കുക.");
                    });
                } else {
                    // നിലവിലുള്ള അക്കൗണ്ട്
                    snapshot.forEach(doc => {
                        let data = doc.data();
                        localStorage.setItem('userName', data.name);
                        localStorage.setItem('userPhone', data.phone);
                        localStorage.setItem('userIcon', data.icon || selectedIcon);

                        if (data.status === 'approved') {
                            window.location.href = "dashboard.html";
                        } else {
                            alert("നിങ്ങളുടെ അക്കൗണ്ട് അഡ്മിൻ ഇതുവരെ അപ്പ്രൂവ് ചെയ്തിട്ടില്ല!");
                        }
                    });
                }
            }).catch(err => {
                alert("ലോഗിൻ ചെയ്യുന്നതിൽ പിഴവ്: " + err.message);
            });
        }
    </script>
</body>
</html>
